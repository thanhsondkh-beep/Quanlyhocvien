<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4A3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học việc Dược">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 26 26%27%3E%3Crect width=%2726%27 height=%2726%27 rx=%276%27 fill=%27%230E4A3F%27/%3E%3Cpath d=%27M10 5h6v5h5v6h-5v5h-6v-5H5v-6h5z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<title>Học việc Khoa Dược</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g900:#0B3B8C; --g700:#1663D6; --g500:#2F80ED; --g100:#E4EEFD; --g050:#F2F7FE;
  --paper:#F4F7FC; --ink:#17233A; --muted:#64748B; --line:#E2E8F1; --white:#fff;
  --ok:#1E9E5A; --ok100:#E3F5EA; --amber:#B86A00; --amber100:#FFF1DD; --orange:#F08A24;
  --red:#C2362B; --red100:#FDE8E6; --grey100:#EEF2F7;
  --s1:#2F80ED; --s2:#0E9AA0; --s3:#7B61FF; --s4:#E07B1A; --s5:#1E9E5A;
  --r:14px; --shadow:0 1px 2px rgba(16,42,90,.06),0 4px 14px rgba(16,42,90,.06);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g700)}
:focus-visible{outline:2px solid var(--g500);outline-offset:2px}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;font-weight:600}
h1{font-size:1.5rem;letter-spacing:-.01em} h2{font-size:1.15rem} h3{font-size:1.02rem}
p{margin:.3em 0 .8em}
.muted{color:var(--muted)} .small{font-size:.86rem} .nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none;vertical-align:middle}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--white);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none;color:var(--g900)}
.logo b{display:block;font-size:.98rem;line-height:1.2;font-weight:700}
.logo span{font-size:.8rem;color:var(--g700);font-weight:600}
.side a.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:#3A4A63;margin-bottom:2px;font-weight:500}
.side a.nv:hover{background:var(--g050);color:var(--g700)}
.side a.nv.on{background:var(--g700);color:#fff;box-shadow:0 4px 12px rgba(22,99,214,.25)}
.side .grp{font-size:.76rem;color:var(--muted);margin:14px 12px 6px}
.side .badge{margin-left:auto}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 28px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.search{flex:1;max-width:420px;position:relative}
.search input[type=search]{width:100%;padding:9px 12px 9px 38px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.topbar .sp{flex:1}
.bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;color:#3A4A63;text-decoration:none}
.bell:hover{background:var(--g050)}
.bell i{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:.68rem;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center}
.me{display:flex;align-items:center;gap:10px}
.me .t{line-height:1.25;font-size:.86rem} .me .t b{display:block;font-size:.9rem}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2F80ED,#0B3B8C);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.9rem;flex:none}
main{padding:24px 28px 60px;max-width:1240px;width:100%;min-width:0}
.demo-bar{background:var(--amber100);color:#5d3c08;padding:7px 28px;font-size:.86rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-bar select{width:auto;max-width:100%;padding:3px 6px;border-radius:6px;border:1px solid #e3c896;background:#fff}
.mobilebar,.sheet{display:none}
.mlogo{display:none;align-items:center;gap:8px;text-decoration:none;color:var(--g700);font-size:.74rem;line-height:1.2;font-weight:600}
.mlogo b{display:block;color:var(--g900);font-size:.9rem}
.mlogo svg{width:32px;height:32px}

/* ---------- building blocks ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2,.card-h h3{margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid-review{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--g700);background:var(--g700);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;font-size:.92rem}
.btn:hover{background:var(--g900);border-color:var(--g900)}
.btn.ghost{background:#fff;color:var(--g700);border-color:#C9DAF5} .btn.ghost:hover{background:var(--g050)}
.btn.danger{background:#fff;color:var(--red);border-color:#F1C0BB} .btn.danger:hover{background:var(--red100)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.sm{padding:5px 11px;font-size:.84rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--g700);cursor:pointer;padding:0;font-weight:600;font-size:.88rem;text-decoration:none}
label.f{display:block;font-size:.86rem;color:var(--muted);margin-bottom:10px}
label.f>span{display:block;margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input[type=number]{max-width:120px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.82rem;background:#F7F9FD}
tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.tbl-wrap table th:first-child,.tbl-wrap table td:first-child{padding-left:16px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:.78rem;font-weight:600;background:var(--g100);color:var(--g700);white-space:nowrap}
.tag.ok{background:var(--ok100);color:var(--ok)} .tag.amber{background:var(--amber100);color:var(--amber)} .tag.red{background:var(--red100);color:var(--red)} .tag.grey{background:var(--grey100);color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #CBD6E6;border-radius:var(--r);background:#fff}
.toast{pointer-events:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:.92rem;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.toast.err{background:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tabs button,.tabs a{border:1px solid var(--line);background:#fff;padding:7px 14px;cursor:pointer;border-radius:9px;color:#3A4A63;white-space:nowrap;font-weight:500;text-decoration:none;font-size:.9rem}
.tabs button.on,.tabs a.on{background:var(--sc,var(--g700));border-color:var(--sc,var(--g700));color:#fff}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--g700);flex:none}
.done-line{color:var(--muted)}
.bar{height:8px;background:var(--grey100);border-radius:6px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.score{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--g900);line-height:1}
.ms-cell{min-width:46px;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.dls{background:var(--g050);border-left:3px solid var(--g500);padding:7px 11px;border-radius:0 8px 8px 0;font-size:.9rem}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.thread .c{border-top:1px solid var(--line);padding:10px 0}
.thread .c:first-child{border-top:0}
.thread .c .m{font-size:.82rem;color:var(--muted)}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r);background:linear-gradient(105deg,#fff 0%,#fff 38%,#EAF2FF 62%,#D7E7FF 100%);border:1px solid var(--line);padding:24px 26px;margin-bottom:18px;min-height:150px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 4px;font-size:1.55rem}
.hero p{margin:0;color:var(--muted);max-width:46ch}
.hero .art{position:absolute;right:0;top:0;height:100%;width:52%;pointer-events:none}
.hero .slogan{position:absolute;right:26px;top:50%;transform:translateY(-50%);text-align:right;color:var(--g900);font-weight:600;font-size:1.02rem;line-height:1.6}
.home-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px}
.donut-wrap{display:flex;align-items:center;gap:22px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:104px}
.stat .si{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.stat b{font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:#3A4A63;line-height:1.3}
.st-blue{background:#EAF2FF} .st-blue .si{background:var(--g500)}
.st-green{background:var(--ok100)} .st-green .si{background:var(--ok)}
.st-orange{background:#FFF0E2} .st-orange .si{background:var(--orange)}
.st-grey{background:#EFF2F6} .st-grey .si{background:#8193AD}
.home-mid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.next{display:flex;gap:16px;align-items:center}
.next .thumb{width:96px;height:80px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.next .meta{flex:1;min-width:0}
.next .meta b{display:block;font-size:1.02rem;margin-bottom:6px}
.nt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;text-decoration:none;color:var(--ink);background:#fff}
.nt:hover{border-color:#C9DAF5;background:var(--g050)}
.nt .d{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.nt .tx{flex:1;font-size:.9rem;line-height:1.4}
.nt .tm{font-size:.76rem;color:var(--muted);white-space:nowrap}
.nt.new{border-left:3px solid var(--g500)}

/* ---------- roadmap list ---------- */
.steps .st{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;text-decoration:none;color:var(--ink)}
.steps .st:hover{border-color:#C9DAF5;background:var(--g050)}
.steps .st.cur{border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
.steps .no{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;border:2px solid var(--sc);color:var(--sc);background:#fff}
.steps .no.done{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .tt{flex:1;min-width:0}
.steps .tt b{display:block}
.steps .pc{width:120px;text-align:right}
.steps .pc .bar{margin-top:5px}
.stage-head{border-left:5px solid var(--sc);padding:4px 0 4px 14px;margin-bottom:14px}
.stage-head .k{font-size:.86rem;color:var(--sc);font-weight:600}

/* ---------- rail ---------- */
.rail{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px;margin-bottom:18px;box-shadow:var(--shadow)}
.rail-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rail-head .now{font-size:1.02rem;font-weight:600}
.rail-grid{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:3px}
.rail-band{height:30px;border-radius:7px;color:#fff;font-size:.78rem;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap;cursor:pointer;border:0;text-align:left;font-weight:600}
.rail-band:hover{filter:brightness(1.08)}
.rail-wk{height:18px;border-radius:4px;background:var(--grey100);font-size:.66rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.rail-wk.past{background:var(--g100);color:var(--g700)}
.rail-wk.cur{background:var(--g700);color:#fff;font-weight:700}
.rail-ms{height:20px;display:flex;align-items:center;justify-content:center}
.rail-ms span{width:11px;height:11px;transform:rotate(45deg);background:#fff;border:2px solid var(--ink);display:block}
.rail-ms.ok span{background:var(--ok);border-color:var(--ok)}
.rail-ms.bad span{background:var(--red);border-color:var(--red)}
.rail-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.rail-legend i{display:inline-block;width:9px;height:9px;transform:rotate(45deg);border:2px solid var(--ink);margin-right:6px;vertical-align:middle}

/* ---------- docs ---------- */
.doc{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.doc .fi{width:42px;height:46px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.7rem;flex:none;flex-direction:column;gap:1px}
.fi.pdf{background:#E5533D} .fi.docx{background:#2B6BD6} .fi.xlsx{background:#1E8E4E} .fi.video{background:#2F80ED} .fi.link{background:#7A8BA6}
.doc .dt{flex:1;min-width:0}
.doc .dt b{display:block;line-height:1.35}
.doc .dt .m{font-size:.8rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
.doc .act{display:flex;gap:6px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--g700);cursor:pointer;text-decoration:none}
.iconbtn:hover{background:var(--g050)}
.iconbtn.off{color:#B6C2D3;cursor:default}

/* ---------- exams & evaluations ---------- */
.ex{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.ex .xi{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.ex .xt{flex:1;min-width:0}
.ex .xt b{display:block}
.ex .xt .m{font-size:.8rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.ex .xr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pt{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--g900)}
.pt small{font-size:.8rem;color:var(--muted);font-weight:500}
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
.q .qn{font-size:.82rem;color:var(--muted);margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:var(--g050)}
.opt input{margin-top:4px;accent-color:var(--g700)}
.opt.right{background:var(--ok100);border-color:var(--ok)} .opt.wrong{background:var(--red100);border-color:var(--red)}
.timer{position:sticky;top:64px;z-index:5;background:var(--g900);color:#fff;padding:10px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.timer b{font-variant-numeric:tabular-nums;font-size:1.15rem}
details.ev summary{list-style:none;cursor:pointer}
details.ev summary::-webkit-details-marker{display:none}

/* ---------- charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.kpi .si{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.kpi b{font-size:1.55rem;line-height:1.1;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:.84rem;color:var(--muted)}
.charts{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:#3A4A63}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dleg{list-style:none;padding:0;margin:0;font-size:.88rem}
.dleg li{display:flex;align-items:center;gap:8px;padding:5px 0}
.dleg li i{width:10px;height:10px;border-radius:50%;flex:none}
.dleg li span{flex:1}
.chart svg text{font-family:var(--font)}
.bar-hit:hover rect{opacity:.85}

/* ---------- login ---------- */
.login{max-width:440px;margin:7vh auto;padding:0 16px}
.login .panel{padding:26px}

/* ---------- certificate ---------- */
.cert{border:3px double var(--g900);border-radius:6px;padding:34px 30px;text-align:center;background:#fff;margin-top:14px}
.cert .h{font-weight:600;font-size:.95rem}
.cert h2{font-size:1.5rem;color:var(--g900);margin:18px 0 10px;letter-spacing:.02em}
.cert .nm{font-size:1.4rem;font-weight:700;margin:8px 0}
@media print{
  body *{visibility:hidden}
  .cert,.cert *{visibility:visible}
  .cert{position:absolute;left:0;top:0;width:100%;border-width:4px}
}

@media (max-width:1100px){
  .home-top,.home-mid,.charts{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){.grid-review{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:10px 16px;gap:10px}
  .topbar .search{display:none}
  .mlogo{display:flex}
  .me .t{display:none}
  main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  .demo-bar{padding:7px 16px}
  .mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(16,42,90,.08)}
  .mobilebar a,.mobilebar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:.72rem;color:#5B6B84;text-decoration:none;border:0;background:none;border-radius:10px;min-height:52px;justify-content:center}
  .mobilebar .on{color:var(--g700);font-weight:600}
  .mobilebar .on .ic{color:var(--g700)}
  .sheet.open{display:block;position:fixed;inset:0;z-index:40;background:rgba(15,30,60,.35)}
  .sheet .in{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}

let Store, AuthSvc, DEMO = !FIREBASE_CONFIG.apiKey;
const clean = o => JSON.parse(JSON.stringify(o));
const nowISO = () => new Date().toISOString();
function deepMerge(a, b) { const o = { ...(a || {}) }; for (const k in b) { const v = b[k]; o[k] = (v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" && !Array.isArray(o[k])) ? deepMerge(o[k], v) : v; } return o; }

async function initFirebase() {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}`;
  const appM = await import(`${base}/firebase-app.js`);
  const authM = await import(`${base}/firebase-auth.js`);
  const fsM = await import(`${base}/firebase-firestore.js`);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  const auth = authM.getAuth(app);
  const db = fsM.getFirestore(app);
  const c = n => PREFIX + n;
  Store = {
    async get(col, id) { const s = await fsM.getDoc(fsM.doc(db, c(col), id)); return s.exists() ? { id: s.id, ...s.data() } : null; },
    async set(col, id, data, merge = true) { await fsM.setDoc(fsM.doc(db, c(col), id), clean(data), { merge }); },
    async add(col, data) { const r = await fsM.addDoc(fsM.collection(db, c(col)), clean(data)); return r.id; },
    async del(col, id) { await fsM.deleteDoc(fsM.doc(db, c(col), id)); },
    async list(col, filters = []) {
      const q = fsM.query(fsM.collection(db, c(col)), ...filters.map(f => fsM.where(f[0], f[1], f[2])));
      const s = await fsM.getDocs(q); return s.docs.map(d => ({ id: d.id, ...d.data() }));
    }
  };
  AuthSvc = {
    onChange: cb => authM.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email } : null)),
    signIn: (e, p) => authM.signInWithEmailAndPassword(auth, e, p),
    async signUp(e, p) { const r = await authM.createUserWithEmailAndPassword(auth, e, p); return r.user.uid; },
    signOut: () => authM.signOut(auth),
    reset: e => authM.sendPasswordResetEmail(auth, e),
    async createUser(e, p) {
      const sec = appM.getApps().find(a => a.name === "hv-secondary") || appM.initializeApp(FIREBASE_CONFIG, "hv-secondary");
      const sa = authM.getAuth(sec);
      const r = await authM.createUserWithEmailAndPassword(sa, e, p);
      await authM.signOut(sa); return r.user.uid;
    }
  };
}

function initDemo() {
  const KEY = "hv_demo_db_v1"; let mem = null;
  const load = () => { if (mem) return mem; try { mem = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { } if (!mem) mem = seedDemo(); return mem; };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { } };
  const coll = n => { const d = load(); d[n] = d[n] || {}; return d[n]; };
  const delay = () => new Promise(r => setTimeout(r, 40));
  Store = {
    async get(col, id) { await delay(); const v = coll(col)[id]; return v ? { id, ...clean(v) } : null; },
    async set(col, id, data, merge = true) { await delay(); const c = coll(col); c[id] = merge ? deepMerge(c[id], clean(data)) : clean(data); save(); },
    async add(col, data) { const id = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await this.set(col, id, data, false); return id; },
    async del(col, id) { await delay(); delete coll(col)[id]; save(); },
    async list(col, filters = []) {
      await delay();
      return Object.entries(coll(col)).map(([id, v]) => ({ id, ...clean(v) }))
        .filter(o => filters.every(([f, op, val]) => op === "==" ? o[f] === val : op === "in" ? val.includes(o[f]) : op === "array-contains" ? (o[f] || []).includes(val) : true));
    }
  };
  let cb = null, cur = null;
  try { cur = JSON.parse(sessionStorage.getItem("hv_demo_user") || "null"); } catch (e) { }
  AuthSvc = {
    onChange(f) { cb = f; setTimeout(() => f(cur), 0); },
    async signIn(email) { const u = Object.entries(coll("users")).find(([, v]) => v.email === email); if (!u) throw new Error("Không có tài khoản demo với email này"); cur = { uid: u[0], email }; try { sessionStorage.setItem("hv_demo_user", JSON.stringify(cur)); } catch (e) { } cb(cur); },
    async signUp(email) { const uid = "u" + Date.now().toString(36); cur = { uid, email }; try { sessionStorage.setItem("hv_demo_user", JSON.stringify(cur)); } catch (e) { } setTimeout(() => cb(cur), 120); return uid; },
    async signOut() { cur = null; try { sessionStorage.removeItem("hv_demo_user"); } catch (e) { } cb(null); },
    async reset() { },
    async createUser() { return "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); },
    resetAll() { try { localStorage.removeItem(KEY); } catch (e) { } mem = null; }
  };
}

/* =====================================================================
   SHARED: 26-week rail
   ===================================================================== */
function rail(cfg, week, reviews = [], opts = {}) {
  const W = cfg.totalWeeks;
  const bands = cfg.stages.map(s => `<button class="rail-band" style="grid-column:${s.from}/${s.to + 1};background:${stageColor(s.no)}" data-act="${opts.stageAct || "pickStage"}" data-stage="${s.id}" title="Giai đoạn ${s.no}: ${esc(s.name)} (tuần ${s.from}–${s.to})">${s.no}. ${esc(s.name)}</button>`).join("");
  const weeks = Array.from({ length: W }, (_, i) => { const w = i + 1; return `<div class="rail-wk ${week && w < week ? "past" : ""} ${w === week ? "cur" : ""}">${w}</div>`; }).join("");
  const rv = Object.fromEntries(reviews.map(r => [r.milestone, r]));
  const ms = Array.from({ length: W }, (_, i) => {
    const m = cfg.milestones.find(x => x.week === i + 1); if (!m) return `<div class="rail-ms"></div>`;
    const res = rv[m.id] ? msResult(cfg, rv[m.id]) : null;
    return `<div class="rail-ms ${res ? (res.pass ? "ok" : "bad") : ""}" title="${m.id} – ${esc(m.name)} (tuần ${m.week})${res ? `: ${res.total} điểm` : ""}"><span></span></div>`;
  }).join("");
  let now = "";
  if (week == null) now = "Chưa có ngày bắt đầu";
  else if (week === 0) now = "Chưa bắt đầu";
  else if (week > W) now = "Đã hoàn thành 26 tuần";
  else { const st = stageOfWeek(cfg, week); const next = cfg.milestones.find(m => m.week >= week); now = `Tuần ${week}/${W} · Giai đoạn ${st.no}: ${st.name}${next ? ` · Mốc ${next.id} ở tuần ${next.week}` : ""}`; }
  return `<div class="rail"><div class="rail-head"><div class="now">${esc(now)}</div>${opts.right || ""}</div>
    <div class="rail-grid">${bands}</div><div class="rail-grid" style="margin-top:4px">${weeks}</div><div class="rail-grid" style="margin-top:2px">${ms}</div>
    <div class="rail-legend"><span><i></i>Mốc đánh giá</span><span><i style="background:var(--g500);border-color:var(--g500)"></i>Đạt</span><span><i style="background:var(--red);border-color:var(--red)"></i>Chưa đạt</span></div></div>`;
}

/* ---------- biểu đồ vòng ---------- */
function donut(pct, size = 150, color = "#1E9E5A", label = "") {
  const r = size / 2 - 12, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, pct));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Hoàn thành ${v}%"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#E7EDF6" stroke-width="16"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c * v / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="50%" y="${label ? "47%" : "50%"}" text-anchor="middle" dominant-baseline="central" font-size="${size / 5.2}" font-weight="700" fill="#17233A">${Math.round(v)}%</text>${label ? `<text x="50%" y="64%" text-anchor="middle" font-size="11" fill="#64748B">${esc(label)}</text>` : ""}</svg>`;
}

/* ---------- học viên: trang chủ ---------- */
function taskStats(cfg, prog, week) {
  let total = 0, done = 0, doing = 0, todo = 0;
  cfg.stages.forEach(s => taskIds(s).forEach(id => { total++; if (prog?.tasks?.[id]) done++; else if (week && s.from <= week) doing++; else todo++; }));
  return { total, done, doing, todo, pct: total ? Math.round(done * 100 / total) : 0 };
}
function nextTask(cfg, prog, week) {
  const order = cfg.stages.filter(s => !week || s.from <= Math.max(week, 1)).concat(cfg.stages.filter(s => week && s.from > week));
  for (const s of order) {
    const i = s.items.findIndex((_, k) => !prog?.tasks?.[`${s.id}_i${k}`]); if (i >= 0) return { st: s, text: s.items[i].content, sub: `Tuần ${s.items[i].w}`, dls: s.items[i].dls };
    const j = s.products.findIndex((_, k) => !prog?.tasks?.[`${s.id}_p${k}`]); if (j >= 0) return { st: s, text: "Nộp sản phẩm: " + s.products[j], sub: "Sản phẩm cuối giai đoạn" };
  }
  return null;
}

let examTimer = null;
async function vTakeExam(examId) {
  clearInterval(examTimer);
  const uid = S.user.uid; const aid = `${examId}_${uid}`;
  const exam = await Store.get("exams", examId);
  if (!exam) return `<div class="empty">Bài lượng giá không tồn tại hoặc đã đóng.</div>`;
  let att = await Store.get("attempts", aid);
  if (att?.status === "da-nop") return `<h1>${esc(exam.title)}</h1><div class="empty">Bạn đã nộp bài lúc ${fmtDT(att.submittedAt)}. Kết quả hiện khi lãnh đạo khoa chấm xong.</div>`;
  const qs = exam.shuffle ? seededShuffle(exam.questions, uid + examId) : exam.questions;
  if (att?.status === "da-cham") {
    const body = qs.map((q, i) => {
      const ans = att.answers?.[q.id];
      if (q.type === "mcq") {
        const ok = att.mcqResult?.[q.id];
        return `<div class="q"><div class="qn">Câu ${i + 1} · trắc nghiệm · ${q.points} điểm · ${ok ? "đúng" : "sai"}</div><div>${nl(q.text)}</div>${q.options.map((o, k) => `<div class="opt ${ans === k ? (ok ? "right" : "wrong") : ""}"><input type="radio" disabled ${ans === k ? "checked" : ""}><span>${esc(o)}</span></div>`).join("")}</div>`;
      }
      return `<div class="q"><div class="qn">Câu ${i + 1} · tự luận · ${att.essayScores?.[q.id] ?? 0}/${q.points} điểm</div><div>${nl(q.text)}</div><div class="dls" style="margin-top:8px">${nl(ans || "(không trả lời)")}</div>${att.essayComments?.[q.id] ? `<p class="small" style="margin-top:8px"><b>Nhận xét:</b> ${nl(att.essayComments[q.id])}</p>` : ""}</div>`;
    }).join("");
    return `<h1>${esc(exam.title)}</h1><div class="panel row"><div class="score">${att.percent}%</div><div><b>${att.total}/${att.maxTotal} điểm</b><div class="small muted">Chấm bởi ${esc(att.gradedByName || "")} · ${fmtDT(att.gradedAt)}</div></div></div>${att.generalComment ? `<div class="panel"><b>Nhận xét chung:</b> ${nl(att.generalComment)}</div>` : ""}${body}<a class="btn ghost" href="#/luonggia">Về danh sách</a>`;
  }
  if (!exam.open) return `<div class="empty">Bài lượng giá này đã đóng.</div>`;
  if (!att) {
    att = { examId, examTitle: exam.title, milestone: exam.milestone, learnerUid: uid, learnerName: S.me.name, answers: {}, status: "dang-lam", startedAt: nowISO() };
    await Store.set("attempts", aid, att, false);
  }
  const end = new Date(att.startedAt).getTime() + exam.durationMin * 60000;
  const body = qs.map((q, i) => q.type === "mcq"
    ? `<div class="q"><div class="qn">Câu ${i + 1} · trắc nghiệm · ${q.points} điểm</div><div style="margin-bottom:6px">${nl(q.text)}</div>${q.options.map((o, k) => `<label class="opt"><input type="radio" name="${q.id}" value="${k}" ${att.answers?.[q.id] === k ? "checked" : ""} data-change="ans" data-q="${q.id}" data-aid="${aid}"><span>${esc(o)}</span></label>`).join("")}</div>`
    : `<div class="q"><div class="qn">Câu ${i + 1} · tự luận · ${q.points} điểm</div><div style="margin-bottom:6px">${nl(q.text)}</div><textarea rows="6" data-input="ansText" data-q="${q.id}" data-aid="${aid}">${esc(att.answers?.[q.id] || "")}</textarea></div>`).join("");
  onAfter(() => {
    const el = document.getElementById("countdown");
    const tick = async () => {
      const left = Math.max(0, end - Date.now()); const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
      if (el) el.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      if (left <= 0) { clearInterval(examTimer); await submitAttempt(aid, true); }
    };
    tick(); examTimer = setInterval(tick, 1000);
  });
  return `<h1>${esc(exam.title)}</h1>
    <div class="timer"><span>Mốc ${esc(exam.milestone)} · ${qs.length} câu · bài tự lưu khi bạn trả lời</span><span>Còn lại <b id="countdown">--:--</b></span></div>
    ${body}
    <div class="row exam-submit"><button class="btn" data-act="submitExam" data-aid="${aid}">Nộp bài</button><span class="small muted">Nộp xong không sửa được nữa.</span></div>`;
}
let saveTimers = {};
async function saveAnswer(aid, q, val) {
  try { await Store.set("attempts", aid, { answers: { [q]: val }, lastSaved: nowISO() }); } catch (e) { toast(errMsg(e), true); }
}
async function submitAttempt(aid, auto) {
  for (const k in saveTimers) { clearTimeout(saveTimers[k]); }
  document.querySelectorAll('[data-input="ansText"]').forEach(t => { /* flush */ });
  const patch = { status: "da-nop", submittedAt: nowISO() };
  const texts = {}; document.querySelectorAll('[data-input="ansText"]').forEach(t => texts[t.dataset.q] = t.value);
  if (Object.keys(texts).length) patch.answers = texts;
  try { await Store.set("attempts", aid, patch); clearInterval(examTimer); toast(auto ? "Hết giờ – bài đã được nộp tự động." : "Đã nộp bài."); location.hash = "#/luonggia"; route(); }
  catch (e) { toast(errMsg(e), true); }
}

const C_DONE = "#1E9E5A", C_DOING = "#2F80ED", C_TODO = "#C7D2E1";
function stackedBars(rows) {
  if (!rows.length) return `<div class="empty">Chưa có học viên.</div>`;
  const bw = 34, gap = 30, left = 40, top = 10, H = 190, W = Math.max(520, left + rows.length * (bw + gap) + 10);
  const y = v => top + H - H * v / 100;
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#E7EDF6"/><text x="${left - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#64748B">${v}%</text>`).join("");
  const bars = rows.map((r, i) => {
    const x = left + 14 + i * (bw + gap); const t = r.total || 1;
    const seg = [[r.done, C_DONE, "Hoàn thành"], [r.doing, C_DOING, "Đang học"], [r.todo, C_TODO, "Chưa học"]];
    let acc = 0; const rects = seg.map(([v, c, l], k) => { if (!v) return ""; const h0 = y(acc * 100 / t), h1 = y((acc + v) * 100 / t); acc += v;
      return `<rect x="${x}" y="${h1 + (k > 0 ? 0 : 0)}" width="${bw}" height="${Math.max(0, h0 - h1 - 2)}" rx="4" fill="${c}"><title>${esc(r.name)} – ${l}: ${v}/${r.total} việc (${Math.round(v * 100 / t)}%)</title></rect>`; }).join("");
    const short = r.name.trim().split(/\s+/).slice(-1)[0];
    return `<g class="bar-hit"><a href="#/hocvien/${r.id}">${rects}<text x="${x + bw / 2}" y="${top + H + 18}" text-anchor="middle" font-size="12" fill="#3A4A63">${esc(short)}</text></a></g>`;
  }).join("");
  return `<div style="overflow-x:auto"><svg width="${W}" height="${top + H + 28}" viewBox="0 0 ${W} ${top + H + 28}" role="img" aria-label="Tiến độ hoàn thành theo học viên">${grid}${bars}</svg></div>`;
}
function multiDonut(parts, total, size = 170, label = "lượt làm bài") {
  const r = size / 2 - 16, c = 2 * Math.PI * r; let off = 0; const gap = total > 1 ? 3 : 0;
  const arcs = parts.filter(p => p.v > 0).map(p => { const len = c * p.v / total; const s = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${Math.max(0, len - gap)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})"><title>${p.l}: ${p.v} (${Math.round(p.v * 100 / total)}%)</title></circle>`; off += len; return s; }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Phân bố kết quả lượng giá"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#EEF2F7" stroke-width="22"/>${arcs}
    <text x="50%" y="46%" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="700" fill="#17233A">${total}</text><text x="50%" y="62%" text-anchor="middle" font-size="11" fill="#64748B">${esc(label)}</text></svg>`;
}

    <div class="row" style="align-items:flex-end">
      ${[["kt", "Kiến thức"], ["kn", "Kỹ năng"], ["sp", "Sản phẩm"], ["td", "Thái độ"]].map(([k, l]) => `<label class="f" style="margin:0"><span>${l} (${cfg.weights[k]}%)</span><input type="number" min="0" max="100" step="any" name="${k}" value="${sc[k] ?? ""}" ${dis}></label>`).join("")}

    <label class="f"><span>Cần cải thiện</span><textarea name="improve" rows="2" ${dis}>${esc(r?.improve || "")}</textarea></label>

function commentThread(list, uid, msId) {

async function vExams() {
  const [exams, atts] = await Promise.all([Store.list("exams"), Store.list("attempts")]);
  const rows = exams.sort((a, b) => (a.milestone || "").localeCompare(b.milestone || "") || (a.title || "").localeCompare(b.title || "")).map(e => {
    const as = atts.filter(a => a.examId === e.id); const pending = as.filter(a => a.status === "da-nop").length;
    const nm = (e.questions || []).filter(q => q.type === "mcq").length, ne = (e.questions || []).filter(q => q.type === "essay").length;
    return `<tr><td><b>${esc(e.title)}</b><div class="small muted">${nm} trắc nghiệm · ${ne} tự luận · ${e.durationMin} phút</div></td><td>${esc(e.milestone)}</td>

      <td class="nowrap">${can("createExam") ? `<a class="btn sm ghost" href="#/de/${e.id}">Sửa đề</a> ` : ""}${can("grade") || isStaff() ? `<a class="btn sm" href="#/baithi/${e.id}">Bài làm</a>` : ""}</td></tr>`;

    <p class="muted">Đề gồm câu trắc nghiệm (chấm tự động khi chấm bài) và câu tự luận (lãnh đạo chấm theo đáp án gợi ý). Đáp án lưu riêng, học viên không đọc được.</p>

}

}
function syncExamDraftFromDOM() {
  if (!examDraft) return;
  document.querySelectorAll("[data-qf]").forEach(el => {
    const i = +el.dataset.i; const q = examDraft.questions[i]; if (!q) return; const f = el.dataset.qf;
    if (f === "text") q.text = el.value; else if (f === "rubric") q.rubric = el.value; else if (f === "points") q.points = Number(el.value || 0);
    else if (f === "opt") q.options[+el.dataset.k] = el.value; else if (f === "answer" && el.checked) q.answer = +el.dataset.k;
  });
  document.querySelectorAll("[data-ef]").forEach(el => {
    const f = el.dataset.ef;
    if (f === "title") examDraft.title = el.value; else if (f === "milestone") examDraft.milestone = el.value; else if (f === "durationMin") examDraft.durationMin = Number(el.value || 1);
    else if (f === "open") examDraft.open = el.checked; else if (f === "shuffle") examDraft.shuffle = el.checked;
    else if (f === "assignedMode") { if (el.value === "all") examDraft.assigned = "all"; else if (examDraft.assigned === "all") examDraft.assigned = []; }
  });
  if (examDraft.assigned !== "all") { const sel = [...document.querySelectorAll('[data-ef="assignee"]')]; if (sel.length) examDraft.assigned = sel.filter(x => x.checked).map(x => x.value); }
}
const newQid = () => "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function parseBulk(txt) {
  return txt.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(b => {
    if (/^\[TL\]/i.test(b)) { const m = b.replace(/^\[TL\]\s*/i, "").split("|"); return { id: newQid(), type: "essay", text: m[0].trim(), points: Number((m[1] || "").trim()) || 1, rubric: "" }; }
    const lines = b.split("\n").map(s => s.trim()).filter(Boolean); const text = lines.shift(); let answer = 0;
    const options = lines.map((l, k) => { if (l.startsWith("*")) { answer = k; l = l.slice(1).trim(); } return l.replace(/^[A-Ha-h][.)]\s*/, ""); });
    return { id: newQid(), type: "mcq", text, options, answer, points: 1 };
  });
}

async function vGrade(aid) {
  if (!can("grade")) return `<div class="empty">Bạn chưa được phân quyền chấm bài.</div>`;
  const a = await Store.get("attempts", aid); if (!a) return `<div class="empty">Không tìm thấy bài làm.</div>`;
  const [e, k] = await Promise.all([Store.get("exams", a.examId), Store.get("examKeys", a.examId)]);
  const qs = e.questions;
  const body = qs.map((q, i) => {

      return `<div class="q"><div class="qn">Câu ${i + 1} · trắc nghiệm · ${ok ? `<b style="color:var(--g700)">đúng +${q.points}</b>` : `<b style="color:var(--red)">sai</b>`}</div><div>${nl(q.text)}</div>${q.options.map((o, j) => `<div class="opt ${j === right ? "right" : ans === j ? "wrong" : ""}"><input type="radio" disabled ${ans === j ? "checked" : ""}><span>${esc(o)}${j === right ? " (đáp án)" : ""}</span></div>`).join("")}</div>`;
    }
    return `<div class="q"><div class="qn">Câu ${i + 1} · tự luận · tối đa ${q.points} điểm</div><div>${nl(q.text)}</div>

  optDel(el) { syncExamDraftFromDOM(); const q = examDraft.questions[+el.dataset.i]; const k = +el.dataset.k; q.options.splice(k, 1); if (q.answer >= q.options.length) q.answer = 0; else if (q.answer > k) q.answer--; route(); },
  async examSave() {
    syncExamDraftFromDOM(); const e = examDraft;
    const bad = e.questions.findIndex(q => !q.text.trim() || (q.type === "mcq" && (q.options.filter(o => o.trim()).length < 2 || q.answer == null)));
    if (bad >= 0) return toast(`Câu ${bad + 1} chưa đủ nội dung hoặc phương án.`, true);
    if (e.assigned !== "all" && !e.assigned.length) return toast("Chọn ít nhất một học viên hoặc giao cho tất cả.", true);
    const pub = { title: e.title, milestone: e.milestone, durationMin: e.durationMin, open: e.open, shuffle: e.shuffle, assigned: e.assigned, updatedAt: nowISO(), updatedBy: S.user.uid,
      questions: e.questions.map(q => q.type === "mcq" ? { id: q.id, type: "mcq", text: q.text, options: q.options, points: q.points } : { id: q.id, type: "essay", text: q.text, points: q.points }) };
    const key = { answers: Object.fromEntries(e.questions.filter(q => q.type === "mcq").map(q => [q.id, q.answer])), rubrics: Object.fromEntries(e.questions.filter(q => q.type === "essay").map(q => [q.id, q.rubric || ""])) };
    try { await Store.set("exams", e.id, pub, false); await Store.set("examKeys", e.id, key, false); toast("Đã lưu đề."); examDraft = null; route(); } catch (x) { toast(errMsg(x), true); }

  async attDel(el) { if (!confirm("Xóa bài làm này để học viên làm lại?")) return; try { await Store.del("attempts", el.dataset.id); route(); } catch (x) { toast(errMsg(x), true); } },
  async gradeSave(el) {
    const aid = el.dataset.aid; const a = await Store.get("attempts", aid); const [e, k] = await Promise.all([Store.get("exams", a.examId), Store.get("examKeys", a.examId)]);
    let total = 0, max = 0; const mcqResult = {}, essayScores = {}, essayComments = {};
    for (const q of e.questions) {
      max += Number(q.points || 0);
      if (q.type === "mcq") { const ok = a.answers?.[q.id] === k?.answers?.[q.id]; mcqResult[q.id] = ok; if (ok) total += Number(q.points || 0); }
      else {

    const tr = el.closest("tr"); const uid = el.dataset.uid; const g = f => tr.querySelector(`[data-uf="${f}"]`);
    const patch = { name: g("name").value.trim() };
    if (g("role") && !g("role").disabled) patch.role = g("role").value;
    if (g("active") && !g("active").disabled) patch.active = g("active").checked;
    const perms = {}; tr.querySelectorAll("[data-perm]").forEach(x => perms[x.dataset.perm] = x.checked);
    if (Object.keys(perms).length) patch.perms = perms;
    else if (["truongkhoa", "phokhoa"].includes(patch.role)) patch.perms = DEFAULT_PERMS[patch.role];
    if (patch.role === "hocvien" || g("startDate")) { if (g("startDate")) { patch.startDate = g("startDate").value; patch.mentorUid = g("mentorUid").value; patch.cohort = g("cohort").value; } }
    if (patch.role && patch.role !== "cho-duyet" && patch.active === undefined) patch.active = true;
    try { await Store.set("users", uid, patch); toast("Đã lưu người dùng."); S.usersCache = null; route(); } catch (x) { toast(errMsg(x), true); }
  },
  async cfgSave() {
    let data; try { data = JSON.parse(document.getElementById("cfgJson").value); } catch (e) { return toast("Dữ liệu chưa đúng định dạng JSON: " + e.message, true); }
    if (!Array.isArray(data.stages) || !Array.isArray(data.milestones) || !data.weights) return toast("Thiếu stages, milestones hoặc weights.", true);
    try { await Store.set("config", "roadmap", { data, updatedAt: nowISO(), updatedBy: S.user.uid }, false); S.cfg = data; toast("Đã lưu cấu hình lộ trình."); } catch (x) { toast(errMsg(x), true); }
  },
  cfgDownload() { const blob = new Blob([document.getElementById("cfgJson").value], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "lo-trinh-hoc-viec.json"; a.click(); },
  cfgReset() { if (!confirm("Thay nội dung trong ô bằng lộ trình gốc? (Chưa lưu cho đến khi bấm Lưu)")) return; document.getElementById("cfgJson").value = JSON.stringify(ROADMAP_DEFAULT, null, 2); }
};
const forms = {
  async login(f) { try { await AuthSvc.signIn(f.email.value.trim(), f.pw.value); } catch (e) { toast(errMsg(e), true); } },
  async signup(f) {
    try { const name = f.name.value.trim(); const email = f.email.value.trim(); pendingName = name; const uid = await AuthSvc.signUp(email, f.pw.value);
      await ensureUserDoc({ uid, email }, name); } catch (e) { toast(errMsg(e), true); }
  },
  async product(f) {
    const id = f.dataset.id; try { await Store.set("progress", S.user.uid, { learnerUid: S.user.uid, products: { [id]: { text: f.text.value, link: f.link.value.trim(), at: nowISO() } }, tasks: { [id]: true } }); toast("Đã lưu sản phẩm."); route(); } catch (e) { toast(errMsg(e), true); }
  },
  async review(f) {
    const cfg = S.cfg; const uid = f.dataset.uid, ms = f.dataset.ms; const m = cfg.milestones.find(x => x.id === ms);
    const num = n => f[n].value === "" ? null : Math.max(0, Math.min(100, Number(f[n].value)));
    const scores = { kt: num("kt"), kn: num("kn"), sp: num("sp"), td: num("td") };
    if (Object.values(scores).some(v => v == null)) return toast("Nhập đủ 4 phần điểm.", true);
    const checklists = {}; (m.checklists || []).forEach(k => { const n = cfg.checklists[k]?.items.length || 0; const arr = []; for (let i = 0; i < n; i++) { const c = f.querySelector(`input[name="cl_${k}_${i}"]:checked`); arr.push(c ? +c.value : null); } checklists[k] = arr; });
    const data = { learnerUid: uid, milestone: ms, scores, checklists, autonomy: f.autonomy.value ? +f.autonomy.value : null, critical: [...f.querySelectorAll('input[name="crit"]:checked')].map(x => +x.value),
      strengths: f.strengths.value, improve: f.improve.value, plan: f.plan.value, reviewerUid: S.user.uid, reviewerName: S.me.name, at: nowISO() };
    if (f.published) data.published = f.published.checked; else data.published = (await Store.get("reviews", `${uid}_${ms}`))?.published || false;
    if (f.locked && !f.locked.disabled) data.locked = f.locked.checked;
    try { await Store.set("reviews", `${uid}_${ms}`, data); const res = msResult(cfg, data); toast(`Đã lưu: ${res.total} điểm – ${res.pass ? "Đạt" : "Chưa đạt"}.`); route(); } catch (e) { toast(errMsg(e), true); }
  },
  async comment(f) {
    try { await Store.add("comments", { learnerUid: f.dataset.uid, milestone: f.dataset.ms, text: f.text.value.trim(), visibleToLearner: f.vis.checked, byUid: S.user.uid, byName: S.me.name, byRole: role(), at: nowISO() }); toast("Đã thêm nhận xét."); route(); } catch (e) { toast(errMsg(e), true); }
  },
  async newUser(f) {
    const r = f.role.value; const email = f.email.value.trim();
    try {
      const uid = await AuthSvc.createUser(email, f.pw.value);
      const doc = { name: f.name.value.trim(), email, role: r, active: true, createdAt: nowISO(), createdBy: S.user.uid };
      if (DEFAULT_PERMS[r]) doc.perms = DEFAULT_PERMS[r];
      if (r === "hocvien") { doc.startDate = f.startDate.value || ""; doc.cohort = f.cohort.value.trim(); }
      await Store.set("users", uid, doc, false); S.usersCache = null; toast(`Đã tạo tài khoản ${email}.`); route();
    } catch (e) { toast(errMsg(e), true); }
  }
};
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const f = actions[el.dataset.act]; if (!f) return;
  if (el.tagName === "A" || el.type === "button" || el.tagName === "BUTTON") ev.preventDefault();
  try { await f(el, ev); } catch (e) { console.error(e); toast(errMsg(e), true); }
});
document.addEventListener("submit", async ev => {
  const f = ev.target.closest("[data-form]"); if (!f) return; ev.preventDefault();
  const b = f.querySelector('[type="submit"]'); if (b) b.disabled = true;
  try { await forms[f.dataset.form](f); } finally { if (b && b.isConnected) b.disabled = false; }
});
document.addEventListener("change", async ev => {
  const el = ev.target;
  if (el.dataset.change === "tick") { try { await Store.set("progress", S.user.uid, { learnerUid: S.user.uid, tasks: { [el.dataset.id]: el.checked } }); el.nextElementSibling?.classList.toggle("done-line", el.checked); } catch (e) { toast(errMsg(e), true); el.checked = !el.checked; } }
  if (el.dataset.change === "ans") saveAnswer(el.dataset.aid, el.dataset.q, +el.value);
  if (el.dataset.change === "demoSwitch") { await AuthSvc.signIn(el.value); location.hash = ""; }
  if (el.dataset.ef === "assignedMode") { syncExamDraftFromDOM(); route(); }
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.input === "ansText") { const k = el.dataset.q; clearTimeout(saveTimers[k]); saveTimers[k] = setTimeout(() => saveAnswer(el.dataset.aid, k, el.value), 800); }
});
window.addEventListener("hashchange", () => { if (!location.hash.startsWith("#/de/")) examDraft = examDraft && location.hash === "#/de/" + examDraft.id ? examDraft : null; if (!location.hash.startsWith("#/lambai")) clearInterval(examTimer); route(); });


/* ---------- thao tác bổ sung cho giao diện mới ---------- */
Object.assign(actions, {
  sheet() { document.getElementById("sheet")?.classList.add("open"); },
  sheetClose(el, ev) { if (ev.target === el) el.classList.remove("open"); },
  goStageRoadL(el) { location.hash = "#/lotrinh/" + el.dataset.stage; },
  docCat(el) { docCat = el.dataset.k; route(); },
  docEdit(el) { docEdit = el.dataset.id; route(); },
  docCancel() { docEdit = null; route(); },
  async docDel(el) { if (!confirm("Xóa tài liệu này khỏi thư viện?")) return; try { await Store.del("docs", el.dataset.id); toast("Đã xóa tài liệu."); route(); } catch (e) { toast(errMsg(e), true); } },
  async docSeed() {
    try { for (const [title, category, type, stage] of DOCS_SEED) await Store.add("docs", { title, category, type, stage, url: "", sizeNote: "", date: nowISO(), addedBy: S.user.uid });
      toast(`Đã nạp ${DOCS_SEED.length} văn bản. Bấm biểu tượng sửa để gắn đường dẫn tệp.`); route(); } catch (e) { toast(errMsg(e), true); }
  },
  print() { window.print(); },
  async exportCSVall() {
    const cfg = S.cfg; const d = await loadStaffData();
    const head = ["Họ tên", "Email", "Khóa", "Ngày bắt đầu", "Tuần", "Tiến độ %", ...cfg.milestones.map(m => m.id), "Điểm cuối khóa", "Xếp loại"];
    const lines = d.learners.map(u => { const rv = d.reviews.filter(r => r.learnerUid === u.id); const cs = courseScore(cfg, rv);
      return [u.name, u.email, u.cohort || "", u.startDate || "", weekOf(u.startDate) ?? "", totalProgress(cfg, d.pBy[u.id]), ...cfg.milestones.map(m => { const r = rv.find(x => x.milestone === m.id); return r ? msTotal(cfg, r) ?? "" : ""; }), cs?.v ?? "", cs?.cls.name ?? ""]; });
    const csv = [head, ...lines].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" })); a.download = `bao-cao-hoc-viec-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  }
});
Object.assign(forms, {
  search(f) { S.docQ = f.q.value.trim(); if (location.hash.startsWith("#/tailieu")) route(); else location.hash = "#/tailieu"; },
  ovSearch() { },
  async doc(f) {
    const data = { title: f.title.value.trim(), url: f.url.value.trim(), category: f.category.value, type: f.type.value, stage: f.stage.value, sizeNote: f.sizeNote.value.trim() };
    try { if (f.dataset.id) await Store.set("docs", f.dataset.id, data); else await Store.add("docs", { ...data, date: nowISO(), addedBy: S.user.uid });
      toast(f.dataset.id ? "Đã lưu tài liệu." : "Đã thêm tài liệu."); docEdit = null; route(); } catch (e) { toast(errMsg(e), true); }
  }
});
document.addEventListener("input", ev => {
  if (ev.target.dataset.input === "ovFilter") { ovQ = ev.target.value; const q = ovQ.toLowerCase().trim(); document.querySelectorAll("#ovTable tbody tr").forEach(tr => tr.style.display = !q || tr.dataset.name.includes(q) ? "" : "none"); }
});

/* =====================================================================
   BOOT
   ===================================================================== */
let pendingName = "";
async function ensureUserDoc(u, name) {
  let me = await Store.get("users", u.uid);
  if (!me) {
    const isBoot = ADMIN_EMAILS.map(x => x.toLowerCase()).includes((u.email || "").toLowerCase());
    me = { name: name || pendingName || u.email.split("@")[0], email: u.email, role: isBoot ? "admin" : "cho-duyet", active: isBoot, createdAt: nowISO() };
    await Store.set("users", u.uid, me, false); me.id = u.uid;
  }
  S.me = me; return me;
}
async function boot() {
  try { if (DEMO) initDemo(); else await initFirebase(); }
  catch (e) { $app.innerHTML = `<div class="login"><div class="panel"><h2>Không kết nối được Firebase</h2><p>${esc(errMsg(e))}</p><p class="small muted">Kiểm tra cấu hình FIREBASE_CONFIG và kết nối mạng.</p></div></div>`; return; }
  AuthSvc.onChange(async u => {
    S.user = u; S.me = null; S.usersCache = null; pickedStage = null; examDraft = null;
    if (u) { try { await ensureUserDoc(u); await loadCfg(); } catch (e) { toast(errMsg(e), true); } }
    route();
  });
}
boot();
</script>
