"Giám đốc bệnh viện","Trưởng khoa Dược","Trưởng phòng Tài chính – Kế toán"],"a":1},{"t":"Theo Điều 4 TT 22/2011, kho hóa chất, cồn phải:","o":["Để chung trong kho thuốc","Đặt tại khoa lâm sàng","Đặt trong phòng pha chế","Tách biệt với kho thuốc"],"a":3},{"t":"Trách nhiệm tính toán hiệu chỉnh liều của dược sĩ DLS được quy định tại:","o":["Điều 11 TT 22/2011","Điều 3 NĐ 131/2020","Điều 15 TT 22/2011","Điều 7 TT 22/2011"],"a":0},{"t":"Trình bày 14 nhiệm vụ của khoa Dược bệnh viện theo TT 22/2011 xếp thành 5 nhóm (cung ứng, chất lượng, dược lâm sàng, quản lý, khác). Với mỗi nhóm, nêu một hoạt động cụ thể đang làm tại khoa Dược bệnh viện mình.","p":2,"r":"Nêu đúng 5 nhóm, mỗi nhóm có các nhiệm vụ phù hợp: 0,3 điểm/nhóm (1,5 điểm)\nVí dụ thực tế tại khoa đúng nhóm: 0,1 điểm/nhóm (0,5 điểm)"},{"t":"Nêu yêu cầu trình độ và chức trách, nhiệm vụ của dược sĩ làm công tác dược lâm sàng theo Điều 11 TT 22/2011.","p":1.5,"r":"Trình độ tối thiểu dược sĩ đại học: 0,25\nChịu trách nhiệm thông tin thuốc, mạng lưới theo dõi ADR, cảnh giác dược: 0,25\nTư vấn sử dụng thuốc cho HĐT&ĐT, cán bộ y tế, người bệnh: 0,25\nGiám sát kê đơn nội trú, ngoại trú: 0,25\nHướng dẫn, kiểm tra sử dụng thuốc; tính toán hiệu chỉnh liều: 0,25\nXem xét thay thuốc tương đương khi có tương tác, trùng hoạt chất, kho hết thuốc – thông tin và thống nhất với khoa lâm sàng: 0,25"},{"t":"Tình huống: Tháng 10/2026, một đồng nghiệp soạn quy trình quản lý thuốc gây nghiện của khoa và trích dẫn “TT 20/2017/TT-BYT”. Em nhận xét thế nào? Trình bày các bước em kiểm tra hiệu lực văn bản và đề xuất chỉnh sửa.","p":1.5,"r":"Nhận định TT 20/2017 (và TT 27/2024) đã hết hiệu lực từ 16/7/2026, thay bằng TT 18/2026/TT-BYT: 0,5\nCác bước kiểm tra: số hiệu, ngày ban hành → tình trạng hiệu lực trên CSDL quốc gia về VBPL → văn bản thay thế, sửa đổi → điều khoản hiệu lực, chuyển tiếp: 0,5\nĐề xuất: cập nhật căn cứ, rà lại nội dung theo TT 18/2026 (bảo quản, người quản lý, sổ sách, báo cáo 15/01 và 48 giờ), lưu ý etomidate, carisoprodol là thuốc hướng thần từ 01/6/2026: 0,5"}]},{"no":2,"title":"Dược lâm sàng: vai trò, nhiệm vụ, kỹ năng","milestone":"M1","q":[{"t":"Theo NĐ 131/2020, người làm công tác DLS (trừ cơ sở y học cổ truyền) phải có trình độ tối thiểu:","o":["Dược sĩ chuyên khoa I","Trung cấp ngành dược","Tốt nghiệp đại học ngành dược","Cao đẳng ngành dược"],"a":2},{"t":"Cơ sở khám, chữa bệnh từ 200 giường trở lên hiện phải có tối thiểu:","o":["1 người làm DLS/200 giường nội trú","1 người/150 giường nội trú","1 người/100 giường nội trú","1 người/50 giường nội trú"],"a":0},{"t":"Chậm nhất từ 01/01/2026, bệnh viện hạng II trở lên phải bảo đảm tối thiểu:","o":["1 người/300 giường","1 người/150 giường và 1,5 người/1.000 đơn ngoại trú BHYT/ngày","1 người/100 giường và 2 người/1.000 đơn ngoại trú BHYT/ngày","1 người/200 giường và 1 người/1.000 đơn ngoại trú BHYT/ngày"],"a":1},{"t":"Chậm nhất từ 01/01/2031, các cơ sở khám, chữa bệnh phải bảo đảm tối thiểu:","o":["1 người/50 giường và 3 người/1.000 đơn","1 người/150 giường và 1,5 người/1.000 đơn","1 người/200 giường và 1 người/1.000 đơn","1 người/100 giường và 2 người/1.000 đơn ngoại trú BHYT/ngày"],"a":3},{"t":"Cơ sở có dưới 200 giường bệnh phải có:","o":["Số người do Sở Y tế quyết định","Ít nhất 2 người làm DLS chuyên trách","Không bắt buộc có người làm DLS","Ít nhất 1 người phụ trách DLS kiêm người làm DLS"],"a":3},{"t":"Thời gian thực hành chuyên môn tối thiểu của người phụ trách DLS có bằng thạc sĩ hoặc CKI liên quan:","o":["2 năm","12 tháng","6 tháng","3 năm"],"a":1},{"t":"Thời gian thực hành chuyên môn tối thiểu của người phụ trách DLS không có bằng sau đại học:","o":["5 năm","6 tháng","2 năm","1 năm"],"a":2},{"t":"Bộ phận DLS thuộc khoa Dược phục vụ:","o":["Người bệnh nội trú và ngoại trú có thẻ BHYT","Chỉ người bệnh ngoại trú","Chỉ người bệnh nội trú có thẻ BHYT","Chỉ người bệnh nội trú"],"a":0},{"t":"Theo Điều 11 NĐ 131/2020, ai trực tiếp tổ chức hoạt động DLS tại cơ sở có khoa Dược?","o":["Trưởng khoa Dược","Trưởng phòng Kế hoạch tổng hợp","Giám đốc bệnh viện","Trưởng các khoa lâm sàng"],"a":0},{"t":"Trách nhiệm nào KHÔNG thuộc người đứng đầu cơ sở theo Điều 10 NĐ 131/2020?","o":["Bố trí đủ người làm DLS","Bảo đảm cơ sở vật chất, trang thiết bị","Trực tiếp thẩm định y lệnh hằng ngày","Bảo đảm đào tạo liên tục cho người làm DLS"],"a":2},{"t":"Kế hoạch phân tích, đánh giá hiệu quả sử dụng thuốc được xây dựng định kỳ:","o":["Hằng quý","6 tháng và hằng năm","2 năm/lần","Hằng tháng"],"a":1},{"t":"Hoạt động nào thuộc DLS tại khoa Dược (Điều 6) nhưng KHÔNG thuộc 4 hoạt động trên từng người bệnh (Điều 7)?","o":["Xem xét y lệnh","Khai thác thông tin người bệnh","Hướng dẫn sử dụng thuốc cho điều dưỡng","Tư vấn xây dựng danh mục thuốc"],"a":3},{"t":"Nội dung nào KHÔNG nằm trong 4 hoạt động DLS trên mỗi người bệnh?","o":["Khai thác tiền sử dùng thuốc","Xem xét thuốc được kê","Duyệt dự trù mua thuốc","Phối hợp tư vấn người bệnh"],"a":2},{"t":"Nội dung nào KHÔNG thuộc 6 điểm xem xét y lệnh?","o":["Tương tác thuốc cần chú ý","Chỉ định, chống chỉ định","Phản ứng có hại của thuốc","Giá thuốc trúng thầu"],"a":3},{"t":"DLS tham gia bình ca lâm sàng trong trường hợp:","o":["Chỉ người bệnh tử vong","Người bệnh nhiễm vi sinh vật kháng thuốc, dùng nhiều thuốc phức tạp hoặc theo yêu cầu người đứng đầu","Mọi người bệnh nhập viện","Chỉ người bệnh có thẻ BHYT"],"a":1},{"t":"Nhà thuốc trong bệnh viện được thay thuốc trong đơn khi:","o":["Cùng hoạt chất, đường dùng, liều lượng và người mua đồng ý","Cùng nhóm dược lý","Bác sĩ kê đơn vắng mặt","Thuốc thay thế có giá rẻ hơn"],"a":0},{"t":"Nhà thuốc trong bệnh viện có quyền từ chối bán thuốc khi:","o":["Ngoài giờ hành chính","Người mua không có thẻ BHYT","Đơn không hợp lệ, có sai sót hoặc có nghi vấn","Thuốc có giá cao"],"a":2},{"t":"Theo QĐ 3809 (Bảng 1.2), thông tin “thuốc dùng đồng thời” cần hỏi gồm:","o":["Chỉ thuốc trong danh mục bệnh viện","Chỉ thuốc được kê đơn","Chỉ thuốc tiêm truyền","Thuốc không kê đơn, thực phẩm chức năng, thuốc đông y, thuốc dùng ngoài"],"a":3},{"t":"Theo QĐ 3809, cần hỏi thuốc người bệnh đã dùng trong khoảng thời gian gần đây là:","o":["3–6 tháng","1 tuần","2 năm","24 giờ"],"a":0},{"t":"Dùng 2 thuốc cùng nhóm dược lý khi một thuốc đã đủ tác dụng thuộc nhóm vấn đề:","o":["Cần thuốc khác","Điều trị không cần thiết","Liều thuốc quá thấp","Cần bổ sung điều trị"],"a":1},{"t":"Truyền thuốc nhanh hơn khuyến cáo được xếp vào nhóm vấn đề:","o":["Liều thuốc quá cao","Liều thuốc quá thấp","Điều trị không cần thiết","Cần bổ sung điều trị"],"a":0},{"t":"Người bệnh nhiễm vi khuẩn kháng với kháng sinh đang dùng thuộc nhóm vấn đề:","o":["Liều thuốc quá cao","Điều trị không cần thiết","Cần thuốc khác","Tác dụng không mong muốn"],"a":2},{"t":"Người bệnh có chỉ định dự phòng nhưng chưa được dùng thuốc thuộc nhóm vấn đề:","o":["Liều thuốc quá thấp","Cần thuốc khác","Điều trị không cần thiết","Cần bổ sung điều trị"],"a":3},{"t":"Khi phát hiện vấn đề liên quan đến thuốc, cách làm đúng của người làm DLS:","o":["Tự sửa y lệnh trong bệnh án","Đề xuất với bác sĩ kèm số liệu, nguồn; bác sĩ quyết định điều trị","Chỉ ghi sổ, không trao đổi","Hướng dẫn người bệnh tự ngừng thuốc"],"a":1},{"t":"Người bệnh 82 tuổi dùng enoxaparin liều chuẩn; yếu tố quyết định cần hiệu chỉnh liều là:","o":["Chức năng thận (độ thanh thải creatinin)","Thời điểm tiêm trong ngày","Giá thuốc","Đường tiêm dưới da"],"a":0},{"t":"Trình bày 4 hoạt động người làm DLS phải thực hiện trên mỗi người bệnh theo Điều 7 NĐ 131/2020 và 6 điểm cần xem xét khi xem xét y lệnh.","p":2,"r":"4 hoạt động: khai thác thông tin (tiền sử dùng thuốc, dữ kiện lâm sàng, cận lâm sàng); xem xét thuốc được kê; hướng dẫn sử dụng thuốc cho điều dưỡng, hộ sinh; phối hợp tư vấn người bệnh – 0,25 điểm/ý (1,0)\n6 điểm: chỉ định; chống chỉ định; lựa chọn thuốc; liều, khoảng cách, thời điểm, đường dùng, đối tượng đặc biệt, thời gian dùng; tương tác; ADR – đủ 6 ý 1,0; thiếu 1 ý trừ 0,15"},{"t":"Bệnh viện hạng II có 300 giường nội trú và trung bình 1.200 đơn ngoại trú BHYT/ngày. Tính số người làm DLS tối thiểu theo NĐ 131/2020 tại thời điểm 01/01/2026 và 01/01/2031. Trình bày cách tính.","p":1.5,"r":"Từ 01/01/2026: 300/150 = 2 người (nội trú) + 1.200 × 1,5/1.000 = 1,8 → 2 người (ngoại trú) = 4 người: 0,75\nTừ 01/01/2031: 300/100 = 3 người + 1.200 × 2/1.000 = 2,4 → 3 người = 6 người: 0,75\nChấp nhận cách làm tròn lên khi có giải thích; thiếu phần ngoại trú trừ 0,25 mỗi mốc"},{"t":"Tình huống: Nữ 80 tuổi, 45 kg, creatinin 140 µmol/L, đang dùng: enoxaparin 1 mg/kg × 2 lần/ngày (điều trị huyết khối tĩnh mạch sâu), ibuprofen 400 mg × 3 lần/ngày, omeprazol 20 mg/ngày, esomeprazol 40 mg/ngày. Tính ClCr và nêu 3 vấn đề liên quan đến thuốc theo nhóm của QĐ 3809, kèm đề xuất.","p":1.5,"r":"ClCr = (140 − 80) × 45 / (0,814 × 140) × 0,85 ≈ 20 ml/phút: 0,3\nLiều quá cao: enoxaparin cần giảm theo thận (ClCr < 30 ml/phút) – đề xuất chỉnh liều theo tờ HDSD: 0,4\nAn toàn/tương tác: NSAID trên người cao tuổi suy thận đang dùng chống đông – nguy cơ chảy máu, suy thận; đề xuất thay giảm đau khác (paracetamol): 0,4\nĐiều trị không cần thiết: trùng lặp 2 thuốc ức chế bơm proton – đề xuất giữ một thuốc: 0,4"}]},{"no":3,"title":"Kiểm nhập, bảo quản thuốc, LASA và thuốc nguy cơ cao","milestone":"M2","q":[{"t":"Theo Điều 15 TT 22/2011, toàn bộ thuốc nhận về phải được kiểm nhập trong thời gian tối đa:","o":["3 ngày","1 tuần","24 giờ","1 tháng"],"a":1},{"t":"Khi kiểm nhập, loại thuốc được kiểm nhập trước là:","o":["Thuốc có giá trị cao","Thuốc lẻ","Thuốc có kích thước nhỏ","Thuốc nguyên đai, nguyên kiện"],"a":3},{"t":"Thành viên nào KHÔNG thuộc Hội đồng kiểm nhập theo TT 22/2011?","o":["Trưởng khoa Dược","Thủ kho","Trưởng khoa lâm sàng","Trưởng phòng Tài chính – Kế toán"],"a":2},{"t":"Khi kiểm nhập phải đối chiếu giữa:","o":["Hóa đơn, thực tế và kết quả thầu","Hóa đơn và phiếu lĩnh","Hóa đơn và đơn đặt hàng","Thực tế và thẻ kho"],"a":0},{"t":"Chi tiết nào KHÔNG thuộc nội dung đối chiếu từng mặt hàng khi kiểm nhập?","o":["Đơn giá","Hãng sản xuất, nước sản xuất","Số lô, hạn dùng","Tên người lái xe giao hàng"],"a":3},{"t":"Thuốc phải kiểm soát đặc biệt khi kiểm nhập:","o":["Kiểm nhập chung biên bản với thuốc thường","Chỉ cần thủ kho ký nhận","Lập biên bản kiểm nhập riêng","Không cần lập biên bản"],"a":2},{"t":"Khi hàng nhập bị hư hao, thừa, thiếu, khoa Dược phải:","o":["Lập biên bản và thông báo cơ sở cung cấp để bổ sung, giải quyết","Nhập kho bình thường","Tự xử lý, không ghi nhận","Trả lại hàng, không lập biên bản"],"a":0},{"t":"Tỷ lệ kiểm soát chất lượng cảm quan thuốc nhập vào khoa Dược:","o":["Chọn ngẫu nhiên","100%","10%","Chỉ thuốc tiêm"],"a":1},{"t":"Thuốc còn hạn nhưng có dấu hiệu biến màu, vẩn đục phải:","o":["Để khu vực riêng chờ xử lý","Chuyển cho khoa lâm sàng dùng ngay","Để nguyên vị trí và theo dõi","Ưu tiên cấp phát trước"],"a":0},{"t":"Điều kiện “bảo quản lạnh” là:","o":["15–25 °C","≤ −10 °C","2–8 °C","8–15 °C"],"a":2},{"t":"Điều kiện “bảo quản mát” là:","o":["25–30 °C","8–15 °C","2–8 °C","15–30 °C"],"a":1},{"t":"Điều kiện bảo quản thường theo GSP:","o":["Dưới 0 °C","8–15 °C","2–8 °C","Khô, thoáng, 15–30 °C"],"a":3},{"t":"Độ ẩm trong kho theo điều kiện bảo quản thường không quá:","o":["90%","75%","50%","60%"],"a":1},{"t":"Thiết bị dùng để theo dõi điều kiện bảo quản phải:","o":["Thay mới hằng năm","Không có yêu cầu riêng","Chỉ kiểm tra khi hỏng","Được hiệu chuẩn định kỳ"],"a":3},{"t":"Theo Điều 17 TT 22/2011, phải bảo quản tại kho riêng:","o":["Thuốc, hóa chất dễ cháy nổ, vắc xin, sinh phẩm","Thuốc viên nén","Dịch truyền","Thuốc uống dạng lỏng"],"a":0},{"t":"LASA là nhóm thuốc:","o":["Hiếm, khó mua","Cần bảo quản lạnh","Nhìn giống nhau, đọc giống nhau","Có giá trị cao"],"a":2},{"t":"Biện pháp đúng khi sắp xếp thuốc LASA:","o":["Loại khỏi danh mục","Chỉ dược sĩ đại học được cấp phát","Tách vị trí, dán nhãn cảnh báo","Xếp liền nhau theo vần chữ cái"],"a":2},{"t":"Kỹ thuật “Tall Man” là:","o":["In hoa phần khác nhau trong tên thuốc","In toàn bộ tên thuốc cỡ chữ lớn","Viết tắt tên thuốc","In tên thuốc màu đỏ"],"a":0},{"t":"Theo QĐ 29/QĐ-BYT (Phụ lục 1), xây dựng danh mục thuốc LASA là hoạt động:","o":["Khuyến khích thực hiện","Cần phải thực hiện","Không quy định","Tham khảo"],"a":1},{"t":"Thuốc nguy cơ cao là thuốc:","o":["Có giá thành cao","Nhập khẩu","Mới đưa vào danh mục","Có nguy cơ gây hại nghiêm trọng khi xảy ra sai sót"],"a":3},{"t":"Thuốc nào nằm trong danh sách thuốc nguy cơ cao gây ADR (TT 21/2013 Phụ lục 8)?","o":["Kali clorid dung dịch đậm đặc tiêm","Vitamin C uống","Amoxicilin uống","Paracetamol uống"],"a":0},{"t":"Natri clorid tiêm được xếp nguy cơ cao khi nồng độ:","o":["0,9%","Mọi nồng độ","0,45%","Lớn hơn 0,9%"],"a":3},{"t":"Biện pháp khi cấp phát thuốc nguy cơ cao:","o":["Cấp nhanh để kịp giờ dùng","Để điều dưỡng tự lấy tại kho","Kiểm tra kép trước khi giao","Không cần ký nhận"],"a":2},{"t":"Phiếu “thay đổi cần biết” được lập khi:","o":["Thuốc hết hạn sử dụng","Thuốc mới trúng thầu khác hãng, hàm lượng, cách pha so với thuốc cũ","Thay đổi thủ kho","Kiểm kê cuối tháng"],"a":1},{"t":"Thời gian bảo quản insulin sau mở nắp tra cứu tại:","o":["Phụ lục 8 TT 21/2013","Điều 17 TT 22/2011","Phụ lục 2 QĐ 5631/QĐ-BYT","Phụ lục 2.2 QĐ 3809/QĐ-BYT"],"a":3},{"t":"Trình bày quy trình kiểm nhập thuốc và các nội dung phải đối chiếu khi kiểm nhập theo Điều 15 TT 22/2011.","p":2,"r":"Hội đồng kiểm nhập do Giám đốc quyết định, thành phần đúng (5 thành phần): 0,4\nKiểm tra điều kiện bảo quản khi nhận; nguyên đai nguyên kiện kiểm trước; toàn bộ trong 1 tuần: 0,4\nĐối chiếu hóa đơn – thực tế – kết quả thầu: tên, hàm lượng, đơn vị tính, quy cách, số lượng, số lô, đơn giá, hạn dùng, hãng, nước sản xuất: 0,5\nKiểm soát cảm quan 100%: 0,2\nLập biên bản hư hao, thừa thiếu; thuốc KSĐB biên bản riêng; đủ chữ ký; vào sổ kiểm nhập: 0,5"},{"t":"Nêu các nguyên tắc bảo quản thuốc tại kho khoa Dược theo Điều 17 TT 22/2011 và ý nghĩa của 4 điều kiện bảo quản ghi trên nhãn (thường, mát, lạnh, đông lạnh).","p":1.5,"r":"Nguyên tắc: GSP; ghi nhiệt độ, độ ẩm ≥ 2 lần/ngày; tránh ánh sáng; bảo quản theo nhãn; FEFO; biệt trữ thuốc bất thường; kho riêng cho chất dễ cháy nổ, vắc xin, sinh phẩm; thiết bị hiệu chuẩn – mỗi ý 0,1, tối đa 0,7\nĐiều kiện: thường 15–30 °C, độ ẩm ≤ 75%; mát 8–15 °C; lạnh 2–8 °C; đông lạnh ≤ −10 °C – 0,2 điểm/ý (0,8)"},{"t":"Tình huống: Sáng thứ Hai, nhiệt kế tủ lạnh trong kho chỉ 12 °C; sổ ghi chiều thứ Sáu 5 °C, không có số liệu thứ Bảy, Chủ nhật. Trong tủ có insulin và vắc xin. Em xử lý thế nào và đề xuất gì để không lặp lại?","p":1.5,"r":"Xử lý ngay: biệt trữ, tạm ngừng cấp phát thuốc trong tủ; chuyển sang tủ đạt 2–8 °C; báo trưởng khoa: 0,5\nĐánh giá: tra thông tin độ ổn định nhiệt của nhà sản xuất, liên hệ nhà cung cấp; quyết định sử dụng hay hủy theo quy định; lập biên bản: 0,5\nPhòng ngừa: theo dõi 2 lần/ngày cả ngày nghỉ (hoặc nhiệt kế tự ghi, cảnh báo), hiệu chuẩn thiết bị, kiểm tra nguồn điện, cập nhật SOP: 0,5"}]},{"no":4,"title":"Cấp phát, sử dụng thuốc nội trú và tủ trực","milestone":"M2","q":[{"t":"Theo Điều 3 TT 23/2011, yêu cầu khi ghi y lệnh thuốc:","o":["Được ghi ký hiệu thay tên thuốc","Sửa không cần ký nếu cùng người ghi","Được viết tắt tên thuốc thông dụng","Không viết tắt tên thuốc; sửa nội dung phải ký xác nhận bên cạnh"],"a":3},{"t":"Nội dung nào KHÔNG bắt buộc khi ghi chỉ định thuốc?","o":["Giá thuốc","Liều một lần, số lần trong 24 giờ","Thời điểm dùng thuốc","Nồng độ, hàm lượng"],"a":0},{"t":"Thứ tự ghi chỉ định thuốc theo đường dùng:","o":["Uống, tiêm, dùng ngoài, đặt","Theo thứ tự tên thuốc","Tiêm, uống, đặt, dùng ngoài, đường khác","Theo giá trị thuốc"],"a":2},{"t":"Nhóm thuốc nào KHÔNG thuộc nhóm phải đánh số thứ tự ngày dùng?","o":["Corticoid","Thuốc hạ huyết áp","Kháng sinh","Thuốc điều trị lao"],"a":1},{"t":"Khi khám, thầy thuốc liệt kê các thuốc người bệnh đã dùng trước khi nhập viện trong vòng:","o":["7 ngày","24 giờ","30 ngày","48 giờ"],"a":1},{"t":"Người bệnh đã ổn định thuốc và liều, thời gian chỉ định thuốc tối đa:","o":["2 ngày (ngày làm việc), 3 ngày (ngày nghỉ)","3 ngày (làm việc), 5 ngày (nghỉ)","1 ngày (làm việc), 2 ngày (nghỉ)","7 ngày"],"a":0},{"t":"Đường tiêm chỉ dùng khi:","o":["Người bệnh yêu cầu","Thuốc tiêm được BHYT chi trả","Muốn rút ngắn thời gian nằm viện","Người bệnh không uống được, đường uống không đáp ứng hoặc thuốc chỉ có dạng tiêm"],"a":3},{"t":"Phiếu lĩnh thuốc của khoa lâm sàng được phê duyệt bởi:","o":["Điều dưỡng trưởng khoa","Bất kỳ bác sĩ trong khoa","Trưởng khoa hoặc thầy thuốc được ủy quyền bằng văn bản","Dược sĩ khoa Dược"],"a":2},{"t":"Phiếu lĩnh vào ngày nghỉ hoặc cấp thuốc đột xuất do ai ký?","o":["Điều dưỡng trực","Thủ kho","Bác sĩ, y sĩ trực","Không được lĩnh"],"a":2},{"t":"Người duyệt phiếu lĩnh tại khoa Dược trong giờ hành chính:","o":["Trưởng khoa lâm sàng","Kế toán dược","Thủ kho","Trưởng khoa Dược hoặc dược sĩ được ủy quyền"],"a":3},{"t":"Nhóm thuốc phải có phiếu lĩnh riêng:","o":["Thuốc gây nghiện, hướng tâm thần, phóng xạ","Vitamin","Kháng sinh","Dịch truyền"],"a":0},{"t":"Khi phiếu lĩnh có sai sót, khoa Dược:","o":["Tự sửa phiếu lĩnh","Từ chối cấp phát, thông báo bác sĩ kê đơn và người ký duyệt","Cấp phát một nửa số lượng","Cấp phát rồi báo sau"],"a":1},{"t":"Thuốc dư do thay đổi y lệnh, ra viện, chuyển viện, tử vong trả lại khoa Dược trong:","o":["Cuối tháng","24 giờ","48 giờ","7 ngày"],"a":1},{"t":"Thuốc cấp lẻ không còn nguyên bao gói phải:","o":["Chỉ ghi tên người bệnh","Để trần trong khay","Giao ngay, không cần nhãn","Đóng gói kín khí, nhãn ghi tên, nồng độ – hàm lượng, hạn dùng"],"a":3},{"t":"Nội dung nào KHÔNG thuộc “5 đúng” theo TT 23/2011?","o":["Đúng giá","Đúng liều dùng","Đúng đường dùng","Đúng người bệnh"],"a":0},{"t":"“3 kiểm tra” gồm:","o":["Đường dùng, chất lượng, thời gian","Số giường, nhãn thuốc, hạn dùng","Họ tên người bệnh, tên thuốc, liều dùng","Tên thuốc, giá, số lô"],"a":2},{"t":"“5 đối chiếu” gồm:","o":["Chẩn đoán, tuổi, cân nặng, giới, địa chỉ","Hãng, nước sản xuất, số lô, hạn dùng, giá","Họ tên, tên thuốc, liều, giá, số lô","Số giường, nhãn thuốc, đường dùng, chất lượng thuốc, thời gian dùng"],"a":3},{"t":"“3 kiểm tra – 5 đối chiếu” được quy định trong văn bản về:","o":["Tổ chức khoa Dược (TT 22/2011)","Dược lâm sàng (NĐ 131/2020)","Công tác điều dưỡng (TT 07/2011/TT-BYT)","Sử dụng thuốc trong cơ sở có giường bệnh (TT 23/2011)"],"a":2},{"t":"Phiếu công khai thuốc được:","o":["Dược sĩ ký","Người bệnh hoặc người nhà ký nhận","Không cần ký","Bác sĩ điều trị ký"],"a":1},{"t":"Điều dưỡng phát hiện y lệnh quá liều, đường dùng không hợp lý phải:","o":["Báo bác sĩ điều trị hoặc bác sĩ trực","Vẫn thực hiện theo y lệnh","Tự giảm liều","Bỏ không thực hiện, không báo"],"a":0},{"t":"Hành vi bị nghiêm cấm tại khoa lâm sàng theo TT 23/2011:","o":["Ghi sổ thuốc thường trực","Cá nhân vay, mượn, đổi thuốc","Kiểm tra hạn dùng","Bàn giao thuốc giữa các ca"],"a":1},{"t":"Danh mục và cơ số tủ trực do:","o":["Khoa Dược tự quyết định","Sở Y tế quy định","Trưởng khoa đề nghị, Giám đốc phê duyệt","Điều dưỡng trưởng quyết định"],"a":2},{"t":"Tổ kiểm kê tủ trực tại khoa lâm sàng:","o":["1 dược sĩ","2 người","Điều dưỡng trưởng làm tổ trưởng","Ít nhất 3 người, đại diện khoa Dược làm tổ trưởng"],"a":3},{"t":"Nội dung nào KHÔNG thuộc kiểm tra, đối chiếu khi cấp phát (Điều 15 TT 22/2011)?","o":["Tên nhà thầu cung ứng","Thể thức phiếu lĩnh, đơn thuốc","Nhãn thuốc","Số lượng, số khoản"],"a":0},{"t":"Hướng dẫn điều dưỡng cách pha, tốc độ truyền là hoạt động DLS quy định tại:","o":["Điều 3 NĐ 131/2020","Điều 6 khoản 1 NĐ 131/2020","Điều 7 khoản 3 NĐ 131/2020","Điều 10 NĐ 131/2020"],"a":2},{"t":"Trình bày trách nhiệm của khoa lâm sàng (điều dưỡng) trước, trong và sau khi cho người bệnh dùng thuốc theo Điều 6 TT 23/2011.","p":2,"r":"Trước: công khai thuốc, người bệnh ký phiếu; hướng dẫn tuân thủ; kiểm tra thuốc so với y lệnh, hạn dùng, cảm quan; báo bác sĩ khi y lệnh bất thường; chuẩn bị phương tiện, hộp chống sốc, pha đúng dung môi: 0,8\nTrong: vô khuẩn; 5 đúng (kể đủ 5); chứng kiến người bệnh dùng thuốc, phát hiện bất thường: 0,6\nSau: theo dõi, ghi diễn biến; bác sĩ theo dõi tác dụng, xử trí tai biến; đánh dấu thuốc đã thực hiện; bảo quản thuốc còn lại; xử lý dụng cụ: 0,6"},{"t":"Khi duyệt phiếu lĩnh và cấp phát thuốc cho khoa lâm sàng, dược sĩ cần kiểm tra những gì? Nêu cách xử lý khi phát hiện sai sót.","p":1.5,"r":"Duyệt phiếu lĩnh: số lượng bất thường; trùng hoạt chất; kháng sinh ưu tiên quản lý chưa duyệt; thuốc KSĐB sai chữ ký; ngoài danh mục, ngoài cơ số: 0,6\nĐối chiếu khi cấp phát: thể thức; tên, nồng độ, dạng bào chế, liều, đường dùng, khoảng cách; nhãn; chất lượng; số lượng, số khoản: 0,5\nXử lý: từ chối cấp phát, báo bác sĩ kê đơn và người ký duyệt; phiếu thay thế phải được người ký xác nhận; ghi sổ: 0,4"},{"t":"Tình huống: Kiểm tra tủ trực khoa Nội phát hiện: 2 ống adrenalin hết hạn từ tháng trước; 1 bút insulin đã mở nắp không ghi ngày mở; ống kali clorid 10% đặt cạnh ống natri clorid 0,9% cùng kích cỡ; sổ bàn giao thiếu chữ ký 2 ca. Nêu các sai sót, nguy cơ và đề xuất khắc phục.","p":1.5,"r":"Adrenalin hết hạn: nguy cơ thiếu thuốc cấp cứu hiệu lực – thay ngay, rà soát hạn dùng định kỳ: 0,4\nInsulin không ghi ngày mở: không xác định hạn sau mở nắp – ghi ngày mở, đối chiếu Phụ lục 2.2 QĐ 3809: 0,3\nKali clorid đậm đặc cạnh NaCl 0,9%: nguy cơ nhầm thuốc nguy cơ cao gây tử vong – tách riêng, nhãn cảnh báo, xem xét không để KCl đậm đặc ở tủ trực nếu không cần: 0,5\nSổ bàn giao thiếu chữ ký: vi phạm bàn giao ca – nhắc nhở, ký đầy đủ; lập biên bản kiểm tra: 0,3"}]},{"no":5,"title":"Thuốc phải kiểm soát đặc biệt","milestone":"M2","q":[{"t":"TT 18/2026/TT-BYT có hiệu lực thi hành từ ngày:","o":["01/6/2026","16/7/2026","01/7/2025","01/01/2026"],"a":1},{"t":"TT 18/2026/TT-BYT thay thế:","o":["TT 20/2017 và TT 27/2024","TT 22/2011 và TT 23/2011","TT 21/2013","TT 52/2017 và TT 18/2018"],"a":0},{"t":"Etomidate, carisoprodol được quy định là thuốc hướng thần từ ngày:","o":["01/01/2027","01/7/2025","01/6/2026","16/7/2026"],"a":2},{"t":"Báo cáo đột xuất khi phát hiện nhầm lẫn, thất thoát thuốc gây nghiện phải gửi trong:","o":["24 giờ","7 ngày","72 giờ","48 giờ"],"a":3},{"t":"Báo cáo năm về thuốc KSĐB của cơ sở khám, chữa bệnh gửi trước ngày:","o":["15/02","15/01","31/12","15/10"],"a":1},{"t":"Bệnh viện thuộc Sở Y tế gửi báo cáo năm thuốc KSĐB cho:","o":["Cơ quan BHXH tỉnh","Bộ Y tế trực tiếp","Cục Quân y","Cơ quan chuyên môn về y tế thuộc UBND cấp tỉnh"],"a":3},{"t":"Danh mục dược chất gây nghiện được ban hành tại:","o":["Phụ lục II TT 18/2026","Phụ lục III TT 18/2026","Phụ lục I TT 18/2026","Phụ lục VII TT 18/2026"],"a":2},{"t":"Việc phân loại thuốc gây nghiện, hướng thần, tiền chất, thuốc dạng phối hợp thực hiện theo:","o":["Phụ lục VII","Phụ lục I","Phụ lục IV","Phụ lục IX"],"a":0},{"t":"Thuốc gây nghiện, hướng thần, tiền chất được bảo quản:","o":["Chung với thuốc thường","Trên quầy cấp phát","Tại kho, tủ riêng có khóa chắc chắn","Trong tủ lạnh"],"a":2},{"t":"Khi không có kho, tủ riêng, thuốc gây nghiện có thể:","o":["Chuyển hết về khoa lâm sàng","Để chung tủ với thuốc hướng thần, tiền chất nhưng xếp riêng, có biển hiệu","Để ngoài tủ có người trông","Để chung với thuốc thường"],"a":1},{"t":"Thuốc dạng phối hợp có chứa dược chất gây nghiện phải:","o":["Không có yêu cầu riêng","Bảo quản lạnh","Để chung với thuốc khác","Để khu vực riêng biệt"],"a":3},{"t":"Thuốc gây nghiện tại tủ trực khoa lâm sàng do ai giữ?","o":["Điều dưỡng viên trực, cấp phát theo y lệnh","Dược sĩ khoa Dược","Trưởng khoa","Bác sĩ trực"],"a":0},{"t":"Số lượng, chủng loại thuốc KSĐB để tại tủ trực do:","o":["Người đứng đầu cơ sở quy định bằng văn bản","Khoa Dược tự quyết","Từng khoa tự quyết","Sở Y tế quy định"],"a":0},{"t":"Người quản lý thuốc hướng thần, tiền chất phải có trình độ tối thiểu:","o":["Đại học ngành dược","Không yêu cầu trình độ","Sau đại học","Trung cấp ngành dược"],"a":3},{"t":"Người quản lý thuốc phóng xạ có thể là:","o":["Thủ kho thuốc thường","Chỉ dược sĩ đại học","Bác sĩ, kỹ thuật viên, điều dưỡng đã đào tạo an toàn bức xạ, được giao bằng văn bản","Bất kỳ nhân viên y tế"],"a":2},{"t":"Sổ theo dõi xuất, nhập, tồn thuốc KSĐB theo mẫu:","o":["Phụ lục IX","Phụ lục VIII","Phụ lục XVIII","Phụ lục XI"],"a":1},{"t":"Biên bản nhận lại thuốc gây nghiện, hướng thần, tiền chất theo mẫu:","o":["Phụ lục IX","Phụ lục VIII","Phụ lục XV","Phụ lục XVIII"],"a":3},{"t":"Yêu cầu với hồ sơ, sổ sách điện tử thuốc KSĐB:","o":["Lưu vết mọi thay đổi và xác nhận điện tử hoặc ký số","Chỉ cần lưu bản in cuối năm","Được sửa trực tiếp, không cần lưu vết","Không cần người xác nhận"],"a":0},{"t":"Hủy thuốc KSĐB thực hiện theo:","o":["Điều 7 TT 23/2011","QĐ 29/QĐ-BYT","Điều 36 NĐ 163/2025/NĐ-CP","Điều 17 TT 22/2011"],"a":2},{"t":"Khi hủy thuốc KSĐB phải hủy cả:","o":["Hộp ngoài và tờ hướng dẫn","Bao bì tiếp xúc trực tiếp với thuốc","Sổ theo dõi","Không cần hủy bao bì"],"a":1},{"t":"Cấp phát, sử dụng thuốc KSĐB tại cơ sở khám, chữa bệnh (trừ cơ sở điều trị nghiện) thực hiện theo:","o":["TT 26/2025/TT-BYT","TT 23/2011/TT-BYT","TT 37/2024/TT-BYT","TT 21/2013/TT-BYT"],"a":1},{"t":"Đơn thuốc “N” kê thuốc gây nghiện cho bệnh cấp tính, số ngày tối đa:","o":["10 ngày","5 ngày","30 ngày","7 ngày"],"a":3},{"t":"Đơn thuốc “H” kê thuốc hướng thần cho bệnh cấp tính, số ngày tối đa:","o":["30 ngày","5 ngày","10 ngày","7 ngày"],"a":2},{"t":"Biên bản nhận lại thuốc từ người bệnh được lập:","o":["2 bản: 1 bản lưu nơi cấp, 1 bản giao người trả","Không cần lập biên bản","1 bản lưu khoa Dược","3 bản"],"a":0},{"t":"Thuốc cần có sẵn khi người bệnh dùng opioid để xử trí ức chế hô hấp:","o":["Naloxon","Vitamin K","Atropin","Flumazenil"],"a":0},{"t":"Trình bày quy định bảo quản thuốc gây nghiện, hướng thần, tiền chất, thuốc dạng phối hợp tại kho khoa Dược và tại tủ trực khoa lâm sàng theo Điều 3 TT 18/2026.","p":2,"r":"Kho, tủ riêng có khóa chắc chắn, không để cùng thuốc khác; trường hợp chung tủ phải xếp riêng, có biển hiệu: 0,5\nThuốc dạng phối hợp: khu vực riêng biệt: 0,25\nTủ trực: ngăn/ô riêng, tủ có khóa; điều dưỡng trực giữ, cấp theo y lệnh; số lượng, chủng loại do người đứng đầu quy định bằng văn bản: 0,6\nBàn giao ca: bàn giao số lượng và sổ, người giao và nhận ký đủ: 0,35\nGhi sổ xuất, nhập, tồn theo Phụ lục VIII: 0,3"},{"t":"Nêu các loại hồ sơ, sổ sách và báo cáo về thuốc KSĐB mà bệnh viện phải thực hiện (loại, thời hạn, mẫu, nơi gửi).","p":1.5,"r":"Sổ: xuất nhập tồn (PL VIII); sổ pha chế nếu có (PL XIV, XVII); phiếu xuất kho cho cơ sở khác (PL XV); biên bản nhận lại thuốc (PL XVIII); chứng từ mua: 0,6\nBáo cáo năm trước 15/01, mẫu PL IX, gửi cơ quan chuyên môn về y tế thuộc UBND tỉnh: 0,45\nBáo cáo đột xuất trong 48 giờ khi nhầm lẫn, thất thoát, mẫu PL XI: 0,45"},{"t":"Tình huống: Sáng thứ Hai kiểm tủ trực khoa Ngoại, sổ ghi còn 5 ống morphin 10 mg nhưng thực tế còn 4 ống. Trình bày các bước em thực hiện trong 48 giờ.","p":1.5,"r":"Giữ nguyên hiện trạng, đối chiếu sổ bàn giao, phiếu lĩnh, y lệnh, bệnh án để xác định ca và người giữ thuốc: 0,5\nBáo cáo trưởng khoa lâm sàng, Trưởng khoa Dược, lãnh đạo bệnh viện; lập biên bản: 0,5\nLập báo cáo đột xuất bằng văn bản theo Phụ lục XI gửi cơ quan chuyên môn về y tế thuộc UBND tỉnh trong 48 giờ; đề xuất biện pháp phòng ngừa: 0,5"}]},{"no":6,"title":"Danh mục thuốc, Hội đồng Thuốc và Điều trị, phân tích ABC/VEN","milestone":"M3","q":[{"t":"Căn cứ nào KHÔNG dùng để xây dựng danh mục thuốc bệnh viện (Điều 14 TT 22/2011)?","o":["Số lượng người giới thiệu thuốc đến bệnh viện","Khả năng kinh phí","Danh mục kỹ thuật được phê duyệt","Mô hình bệnh tật"],"a":0},{"t":"Danh mục thuốc bệnh viện được rà soát, bổ sung, hiệu chỉnh:","o":["Khi có đoàn thanh tra","5 năm/lần","2 năm/lần","Hằng năm"],"a":3},{"t":"Theo TT 21/2013, khi lựa chọn thuốc ưu tiên:","o":["Thuốc phối hợp nhiều thành phần","Thuốc nhập khẩu","Thuốc dạng đơn chất","Thuốc biệt dược"],"a":2},{"t":"So sánh chi phí giữa các thuốc cùng tác dụng nhưng khác dạng bào chế, cơ chế cần dựa trên:","o":["Giá kê khai","Tổng chi phí liên quan đến quá trình điều trị","Giá đơn vị của từng thuốc","Giá bán lẻ trên thị trường"],"a":1},{"t":"Nguyên tắc xây dựng danh mục thuốc theo TT 21/2013:","o":["Ưu tiên thuốc sản xuất trong nước","Ưu tiên thuốc giá cao","Ưu tiên thuốc mới","Ưu tiên thuốc nhập khẩu"],"a":0},{"t":"Bước đầu tiên khi xây dựng danh mục thuốc:","o":["Tổ chức đấu thầu","Tập huấn sử dụng danh mục","Mua thuốc dự trữ","Thu thập, phân tích tình hình sử dụng thuốc năm trước"],"a":3},{"t":"Chủ tịch Hội đồng Thuốc và Điều trị là:","o":["Trưởng phòng Kế hoạch tổng hợp","Đại diện Sở Y tế","Giám đốc hoặc Phó Giám đốc phụ trách chuyên môn","Trưởng khoa Dược"],"a":2},{"t":"Thư ký Hội đồng Thuốc và Điều trị là:","o":["Chủ tịch Hội đồng kiêm nhiệm","Trưởng phòng Kế hoạch tổng hợp và/hoặc dược sĩ khoa Dược","Điều dưỡng trưởng bệnh viện","Trưởng phòng Tài chính – Kế toán"],"a":1},{"t":"Bệnh viện hạng II trở lên, HĐT&ĐT có thêm ủy viên:","o":["Đại diện BHXH","Người giới thiệu thuốc","Dược lý hoặc dược sĩ dược lâm sàng","Luật sư"],"a":2},{"t":"HĐT&ĐT họp định kỳ:","o":["3 tháng/lần","1 tháng/lần","6 tháng/lần","2 tháng/lần"],"a":3},{"t":"HĐT&ĐT sơ kết, tổng kết và báo cáo định kỳ:","o":["6 và 12 tháng","3 và 6 tháng","Hằng tháng","24 tháng"],"a":0},{"t":"Số thành viên tối thiểu của HĐT&ĐT:","o":["9","5","7","3"],"a":1},{"t":"Tiểu ban nào KHÔNG được nêu tại Điều 12 TT 21/2013?","o":["Tiểu ban đấu thầu","Tiểu ban giám sát thông tin thuốc","Tiểu ban giám sát sử dụng kháng sinh","Tiểu ban giám sát ADR và sai sót"],"a":0},{"t":"HĐT&ĐT phối hợp với hội đồng nào để xây dựng kế hoạch chống kháng thuốc?","o":["Hội đồng thi đua","Hội đồng kiểm nhập","Hội đồng kiểm soát nhiễm khuẩn","Hội đồng khoa học"],"a":2},{"t":"Thuốc hạng A trong phân tích ABC chiếm khoảng:","o":["50% tổng giá trị","75–80% tổng giá trị","5–10% tổng giá trị","15–20% tổng giá trị"],"a":1},{"t":"Thuốc hạng C trong phân tích ABC chiếm khoảng:","o":["15–20% tổng giá trị","75–80% tổng giá trị","30% tổng giá trị","5–10% tổng giá trị"],"a":3},{"t":"Thông thường, số sản phẩm hạng A chiếm:","o":["90% tổng số sản phẩm","10–20% tổng số sản phẩm","40–50% tổng số sản phẩm","60–80% tổng số sản phẩm"],"a":1},{"t":"Thuốc V (Vital) là thuốc:","o":["Dùng trong cấp cứu hoặc quan trọng, nhất thiết phải có","Có giá thành cao","Dùng cho bệnh nhẹ, tự khỏi","Ít được sử dụng"],"a":0},{"t":"Thuốc N (Non-Essential) là thuốc:","o":["Thiết yếu cho bệnh mạn tính","Dùng trong cấp cứu","Dùng cho bệnh nhẹ, tự khỏi, hiệu quả chưa rõ hoặc giá không tương xứng lợi ích","Quan trọng trong mô hình bệnh tật"],"a":2},{"t":"Cách phân loại VEN theo TT 21/2013:","o":["Cơ quan BHXH phân loại","Khoa Dược tự phân loại","Phần mềm tự động phân loại","Từng thành viên HĐT&ĐT xếp loại, sau đó hội đồng thống nhất"],"a":3},{"t":"Nhóm cần ưu tiên rà soát trong ma trận ABC/VEN:","o":["AN","CV","CE","AV"],"a":0},{"t":"Theo phân tích VEN, khi kinh phí hạn chế cần:","o":["Chỉ mua thuốc hạng A","Mua thuốc N trước","Mua thuốc V và E trước N, bảo đảm dự trữ an toàn nhóm V, E","Mua đều các nhóm"],"a":2},{"t":"DDD (liều xác định trong ngày) là:","o":["Liều dùng cho trẻ em","Liều trung bình duy trì hằng ngày với chỉ định chính của một thuốc","Liều khởi đầu","Liều tối đa trong ngày"],"a":1},{"t":"Bệnh viện dùng 20.000 viên amoxicilin 500 mg/năm; DDD đường uống của amoxicilin là 1,5 g. Số DDD tiêu thụ là:","o":["10.000 DDD","15.000 DDD","≈ 3.333 DDD","≈ 6.667 DDD"],"a":3},{"t":"Phương pháp nào KHÔNG thuộc các phương pháp phân tích sử dụng thuốc tại Điều 7 TT 21/2013?","o":["Phân tích VEN","Phân tích ABC","Phân tích SWOT","Phân tích theo DDD"],"a":2},{"t":"Trình bày các tiêu chí lựa chọn thuốc và các bước xây dựng danh mục thuốc bệnh viện theo Điều 5 TT 21/2013.","p":2,"r":"Tiêu chí (mỗi ý 0,15, tối đa 1,0): bằng chứng hiệu quả, an toàn; dạng bào chế phù hợp, ổn định; thuốc tương đương so hiệu quả, an toàn, chất lượng, giá, cung ứng; chi phí – hiệu quả theo tổng chi phí điều trị; ưu tiên đơn chất; ưu tiên generic/INN; yếu tố dược động học, bảo quản\nCác bước (0,2/bước): phân tích sử dụng năm trước (ABC, VEN, ADR, sai sót); đánh giá đề nghị bổ sung/loại bỏ; xây dựng danh mục theo nhóm điều trị và VEN; hướng dẫn sử dụng danh mục; tập huấn và rà soát hằng năm"},{"t":"Trình bày tổ chức (thành phần) và hoạt động của Hội đồng Thuốc và Điều trị theo Điều 10–12 TT 21/2013.","p":1.5,"r":"Thành phần: Chủ tịch, Phó Chủ tịch thường trực, Thư ký, Ủy viên đúng quy định; tối thiểu 5 thành viên; hạng II trở lên có dược lý hoặc DSLS: 0,6\nHoạt động: họp 2 tháng/lần hoặc đột xuất; quy chế, kế hoạch năm; tài liệu gửi trước; biên bản trình Giám đốc; báo cáo 6 và 12 tháng: 0,5\nKể được ≥ 4 trong 5 tiểu ban: 0,4"},{"t":"Tình huống: Tổng tiền thuốc năm của bệnh viện là 10 tỷ đồng. Kết quả phân tích có: thuốc X (bổ trợ gan) 600 triệu, hạng A, xếp N; meropenem 500 triệu, hạng A, xếp V; adrenalin 5 triệu, hạng C, xếp V; vitamin nhóm B tổng hợp 200 triệu, hạng B, xếp N. Xếp các thuốc vào ô ma trận, xác định thứ tự ưu tiên rà soát và đề xuất hướng xử lý với thuốc X.","p":1.5,"r":"Xếp đúng ô: X – AN; meropenem – AV; adrenalin – CV; vitamin B – BN: 0,4\nƯu tiên rà soát AN (thuốc X) trước, sau đó BN (vitamin B); nhóm AV, CV bảo đảm cung ứng, không cắt giảm; meropenem cần giám sát sử dụng theo QĐ 5631: 0,5\nĐề xuất với X: đánh giá bằng chứng hiệu quả, chỉ định thực tế; hạn chế chỉ định hoặc loại khỏi danh mục; phiếu đề xuất trình HĐT&ĐT có bằng chứng, chi phí, tác động quỹ BHYT: 0,6"}]},{"no":7,"title":"Thanh toán bảo hiểm y tế đối với thuốc","milestone":"M3","q":[{"t":"Quỹ BHYT thanh toán chi phí thuốc trên cơ sở:","o":["Giá mua của cơ sở theo pháp luật về đấu thầu","Giá do cơ quan BHXH tự định","Giá bán lẻ trên thị trường","Giá kê khai của nhà sản xuất"],"a":0},{"t":"Tài liệu nào KHÔNG thuộc 4 tài liệu làm căn cứ chỉ định để được BHYT thanh toán (Điều 8 khoản 3 TT 37/2024)?","o":["Dược thư Quốc gia Việt Nam","Tài liệu giới thiệu thuốc của công ty","Hướng dẫn chẩn đoán và điều trị của Bộ Y tế","Tờ HDSD kèm hồ sơ đăng ký được Bộ Y tế cấp phép"],"a":1},{"t":"Dược thư Quốc gia Việt Nam dùng làm căn cứ thanh toán là:","o":["Bất kỳ phiên bản nào","Phiên bản năm 2018","Phiên bản mới nhất","Phiên bản năm 2015"],"a":2},{"t":"Thuốc dùng ngoài chỉ định hoặc có chống chỉ định vẫn được BHYT thanh toán khi:","o":["Người bệnh yêu cầu","Bác sĩ ký cam kết","Thuốc có giá thấp","Cấp cứu người bệnh, không có thuốc thay thế và đã hội chẩn"],"a":3},{"t":"Trường hợp BHYT KHÔNG thanh toán:","o":["Thuốc trong danh mục, chỉ định phù hợp","Thuốc dùng cấp cứu sau hội chẩn","Thuốc đã được kết cấu vào giá dịch vụ khám, chữa bệnh","Thuốc dấu (*) đã hội chẩn"],"a":2},{"t":"Thuốc, lô thuốc bị đình chỉ hoặc thu hồi không được thanh toán kể từ:","o":["Ngày hết hạn sử dụng","Thời điểm, phạm vi ghi trong văn bản đình chỉ, thu hồi","Ngày bệnh viện phát hiện","Ngày nhập kho"],"a":1},{"t":"Thuốc dùng trong thử nghiệm lâm sàng, nghiên cứu khoa học:","o":["Không được quỹ BHYT thanh toán","Thanh toán 100%","Thanh toán nếu có hội chẩn","Thanh toán 50%"],"a":0},{"t":"Danh mục thuốc hóa dược, sinh phẩm thuộc phạm vi hưởng BHYT ban hành kèm theo:","o":["TT 37/2024/TT-BYT","TT 21/2013/TT-BYT","TT 27/2025/TT-BYT","TT 20/2022/TT-BYT"],"a":3},{"t":"Danh mục thuốc hóa dược, sinh phẩm được chia thành:","o":["4 cột","3 cột","5 cột","6 cột"],"a":0},{"t":"Cột 4 của danh mục thuốc hóa dược, sinh phẩm ghi:","o":["Tên thuốc","Số thứ tự","Tỷ lệ, điều kiện thanh toán","Đường dùng"],"a":2},{"t":"Tên thuốc trong danh mục được sắp xếp theo:","o":["Thứ tự chữ cái","Hãng sản xuất","Giá trị thuốc","Nhóm lớn và mã ATC"],"a":3},{"t":"Thuốc có dấu (*) sau tên thuốc:","o":["Chỉ dùng tại bệnh viện hạng I","Phải hội chẩn trước khi dùng, trừ trường hợp cấp cứu","Không được kê ngoại trú","Không cần thủ tục gì thêm"],"a":1},{"t":"Kháng sinh có dấu (*) được BHYT thanh toán khi:","o":["Không bao giờ được thanh toán","Thực hiện đúng quy trình kê đơn theo hướng dẫn quản lý sử dụng kháng sinh của Bộ Y tế","Có kết quả kháng sinh đồ","Luôn được thanh toán"],"a":1},{"t":"Thuốc là dạng muối khác của hoạt chất có trong danh mục:","o":["Phải hội chẩn","Không được thanh toán","Thanh toán 50%","Được thanh toán nếu có cùng chỉ định"],"a":3},{"t":"Người bệnh chỉ dùng một phần đơn vị đóng gói nhỏ nhất, phần còn lại không dùng được:","o":["Không thanh toán","Thanh toán 50%","Thanh toán toàn bộ theo giá của đơn vị đóng gói đó","Thanh toán theo lượng thực dùng"],"a":2},{"t":"Oxy dược dụng không đóng gói riêng được thanh toán theo:","o":["Thời gian thở thực tế × lượng khí trên một đơn vị thời gian","Số ngày nằm viện","Mức khoán","Số bình"],"a":0},{"t":"Thuốc điều trị ung thư được thanh toán khi dùng điều trị ung thư:","o":["Do bác sĩ có phạm vi hành nghề phù hợp chỉ định, tại cơ sở được phép điều trị ung thư","Không được thanh toán","Do bất kỳ bác sĩ nào chỉ định","Chỉ tại bệnh viện tuyến trung ương"],"a":0},{"t":"Thuốc ung thư dùng cho bệnh khác, chưa có HDĐT và không có bác sĩ ung bướu:","o":["Không được thanh toán","Cơ quan BHXH duyệt trước","Tự do chỉ định","Hội chẩn dưới sự chủ trì của lãnh đạo cơ sở trước khi chỉ định"],"a":3},{"t":"Chi phí thuốc pha chế tại cơ sở được quỹ BHYT thanh toán:","o":["Theo đề xuất của cơ sở","Không được thanh toán","Không cao hơn giá thuốc thương mại cùng thành phần, hàm lượng, dạng bào chế","Gấp đôi giá thành phần"],"a":2},{"t":"Điều kiện về thành phần của thuốc pha chế được thanh toán:","o":["Chỉ cần thành phần chính có trong danh mục","Mỗi thành phần hoạt chất có trong danh mục thuốc","Không cần có trong danh mục","Do HĐT&ĐT quyết định"],"a":1},{"t":"Chi phí hao hụt thuốc chưa tính vào giá dịch vụ được thanh toán theo:","o":["Tỷ lệ hao hụt tại TT 55/2017/TT-BYT","Mức khoán 5%","Không thanh toán","Đề xuất của khoa Dược"],"a":0},{"t":"Người bệnh mạn tính nằm viện bệnh khác hết thuốc mạn tính, bác sĩ nội trú không đủ điều kiện kê:","o":["Ngừng thuốc đến khi ra viện","Chuyển viện","Người bệnh tự mua","Hội chẩn với bác sĩ khoa điều trị ngoại trú bệnh mạn tính để kê"],"a":3},{"t":"Văn bản quy định danh mục và thanh toán thuốc dược liệu, thuốc cổ truyền:","o":["TT 26/2025/TT-BYT","TT 27/2025/TT-BYT","TT 37/2024/TT-BYT","TT 55/2025/TT-BYT"],"a":1},{"t":"Danh mục thuốc có kết hợp dược chất với dược liệu (TT 27/2025) có cấu trúc:","o":["5 cột, phân nhóm theo y lý y học cổ truyền","3 cột, phân nhóm theo ATC","4 cột, không phân nhóm","6 cột"],"a":2},{"t":"Thanh toán đối với thuốc thang được quy định tại:","o":["Điều 3 TT 55/2025","Điều 8 TT 37/2024","Điều 17 TT 27/2025","Điều 12 TT 37/2024"],"a":2},{"t":"Trình bày nguyên tắc thanh toán thuốc của quỹ BHYT theo Điều 8 TT 37/2024: cơ sở thanh toán, 4 tài liệu căn cứ chỉ định, trường hợp ngoại lệ và 4 trường hợp không thanh toán.","p":2,"r":"Cơ sở: chi phí thực tế trong lượt khám, chữa bệnh; giá mua theo đấu thầu; mức hưởng, phạm vi; hao hụt; phù hợp dịch vụ kỹ thuật, mã bệnh: 0,4\n4 tài liệu: tờ HDSD được cấp phép; tờ HDSD biệt dược gốc/sinh phẩm tham chiếu; HDĐT của Bộ Y tế; Dược thư Quốc gia bản mới nhất: 0,6\nNgoại lệ: cấp cứu, không có thuốc thay thế, sau hội chẩn: 0,3\nKhông thanh toán: thuốc/lô bị đình chỉ, thu hồi; đã kết cấu giá dịch vụ hoặc trọn gói; phần do nguồn khác chi trả; thử nghiệm lâm sàng, nghiên cứu: 0,7"},{"t":"Trình bày quy định thanh toán trong các trường hợp cụ thể: thuốc dấu (*), thuốc có điều kiện ở cột ghi chú, thuốc điều trị ung thư, thuốc dùng một phần đơn vị đóng gói nhỏ nhất.","p":1.5,"r":"Thuốc dấu (*): hội chẩn trước khi dùng, trừ cấp cứu; kháng sinh (*) theo quy trình kê đơn QĐ 5631: 0,4\nCột ghi chú: thanh toán theo tỷ lệ, điều kiện; chỉ thanh toán khi đáp ứng điều kiện cơ sở, cấp chuyên môn, yêu cầu chuyên môn: 0,4\nThuốc ung thư: bác sĩ đúng phạm vi hành nghề, cơ sở được phép; dùng cho bệnh khác cần HDĐT hoặc hội chẩn: 0,4\nĐóng gói nhỏ nhất: thanh toán toàn bộ đơn vị khi phần còn lại không dùng được: 0,3"},{"t":"Tình huống: Cơ quan BHXH từ chối thanh toán 3 hồ sơ: (a) thuốc dấu (*) dùng cho người bệnh không cấp cứu, hồ sơ không có biên bản hội chẩn; (b) thuốc được kê cho một chỉ định không có trong tờ HDSD, HDĐT của Bộ Y tế và Dược thư, người bệnh không cấp cứu; (c) lọ thuốc tiêm chỉ dùng một nửa liều cho trẻ em, phần còn lại không dùng được và đã hủy, BHXH chỉ thanh toán nửa lọ. Em nhận định từng trường hợp (đúng/sai, căn cứ) và đề xuất phòng ngừa.","p":1.5,"r":"(a) BHXH từ chối đúng – Điều 10 khoản 5 TT 37/2024; phòng ngừa: cảnh báo thuốc (*) trên phần mềm, kiểm tra biên bản khi duyệt: 0,5\n(b) BHXH từ chối đúng – không phù hợp 4 tài liệu (Điều 8 khoản 3), không thuộc ngoại lệ cấp cứu; phòng ngừa: duyệt chỉ định, thông tin thuốc cho bác sĩ: 0,5\n(c) BHXH thanh toán nửa lọ là chưa đúng – Điều 10 khoản 3 cho phép thanh toán toàn bộ đơn vị đóng gói nhỏ nhất; đề xuất giải trình, lưu hồ sơ chứng minh phần còn lại không dùng được: 0,5"}]},{"no":8,"title":"Kê đơn ngoại trú và duyệt đơn thuốc","milestone":"M4","q":[{"t":"Người có thẩm quyền kê đơn thuốc hóa dược ngoại trú theo TT 26/2025:","o":["Điều dưỡng có kinh nghiệm","Dược sĩ đại học","Bác sĩ, y sĩ có chứng chỉ hoặc giấy phép hành nghề khám, chữa bệnh","Mọi nhân viên y tế"],"a":2},{"t":"Kê đơn phải phù hợp tài liệu nào sau đây, TRỪ:","o":["Dược thư quốc gia Việt Nam hiện hành","Tài liệu quảng cáo thuốc","Hướng dẫn chẩn đoán và điều trị","Tờ hướng dẫn sử dụng thuốc được Bộ Y tế phê duyệt"],"a":1},{"t":"Người bệnh khám nhiều chuyên khoa trong cùng một lần khám được kê:","o":["Mỗi chuyên khoa một đơn","Tùy bệnh viện quy định","2 đơn thuốc","1 đơn thuốc gồm chỉ định của các chuyên khoa"],"a":3},{"t":"Phải ghi số tháng tuổi, cân nặng và họ tên người đưa trẻ đến khám đối với trẻ:","o":["Dưới 72 tháng tuổi","Dưới 36 tháng tuổi","Dưới 24 tháng tuổi","Dưới 12 tuổi"],"a":0},{"t":"Thuốc có một hoạt chất được ghi tên trong đơn:","o":["Ghi mã thuốc","Viết tắt tên hoạt chất","Theo tên chung quốc tế, hoặc tên chung quốc tế + (tên thương mại)","Chỉ ghi tên thương mại"],"a":2},{"t":"Thuốc có nhiều hoạt chất hoặc sinh phẩm được ghi:","o":["Theo mã ATC","Theo tên thương mại","Viết tắt","Theo tên chung từng hoạt chất"],"a":1},{"t":"Số lượng thuốc chỉ có một chữ số (nhỏ hơn 10) được ghi:","o":["Thêm số 0 phía trước","Bình thường, không thêm gì","Chỉ ghi bằng chữ","Gạch chân"],"a":0},{"t":"Số lượng thuốc gây nghiện trong đơn được ghi:","o":["Chỉ bằng chữ","Chỉ bằng số","Bằng số La Mã","Bằng số (thêm 0 nếu dưới 10) và bằng chữ"],"a":3},{"t":"Đơn thuốc có thuốc độc:","o":["Ghi thuốc độc trước các thuốc khác","Thứ tự tùy ý","Ghi thuốc độc sau cùng","Phải kê đơn riêng"],"a":0},{"t":"Số ngày sử dụng tối đa của mỗi thuốc trong đơn thông thường:","o":["7 ngày","60 ngày","90 ngày","30 ngày"],"a":3},{"t":"Bệnh thuộc Phụ lục VII TT 26/2025 được kê tối đa:","o":["45 ngày","90 ngày","60 ngày","120 ngày"],"a":1},{"t":"Bệnh nào sau đây có trong Phụ lục VII TT 26/2025 (được kê trên 30 ngày)?","o":["Viêm dạ dày cấp","Mất ngủ cấp","Tăng huyết áp (I10)","Viêm họng cấp"],"a":2},{"t":"Khi cần sửa chữa, điều chỉnh thuốc trong đơn, người kê đơn:","o":["Kê đơn mới thay thế đơn cũ","Sửa bằng bút khác màu","Gạch xóa và ký bên cạnh","Ghi chú dưới đơn"],"a":0},{"t":"Đơn thuốc “N” được làm thành:","o":["2 bản","1 bản","4 bản","3 bản"],"a":3},{"t":"Kê đơn thuốc gây nghiện giảm đau cho người bệnh ung thư, mỗi lần tối đa:","o":["10 ngày","30 ngày, ghi 3 đợt liên tiếp, mỗi đợt ≤ 10 ngày","7 ngày","90 ngày"],"a":1},{"t":"Cam kết về sử dụng thuốc gây nghiện được lập:","o":["Không cần cam kết","3 bản","2 bản: 1 lưu cơ sở, 1 giao người bệnh","1 bản lưu cơ sở"],"a":2},{"t":"Thuốc hướng thần kê cho bệnh cần chữa trị dài ngày, tối đa:","o":["30 ngày","90 ngày","10 ngày","7 ngày"],"a":0},{"t":"Người bệnh lĩnh thuốc trong thời hạn tối đa kể từ ngày kê đơn:","o":["10 ngày","05 ngày","03 ngày","07 ngày"],"a":1},{"t":"Người bệnh cần dùng tiếp thuốc 5 ngày sau ra viện:","o":["Không được kê đơn","Chuyển cơ sở khác","Ghi chỉ định vào bệnh án nội trú và kê đơn phù hợp","Bắt buộc lập bệnh án ngoại trú"],"a":2},{"t":"Bệnh viện phải thực hiện kê đơn thuốc điện tử trước ngày:","o":["01/01/2026","01/01/2027","01/7/2025","01/10/2025"],"a":3},{"t":"TT 55/2025/TT-BYT về kê đơn thuốc cổ truyền, dược liệu có hiệu lực từ:","o":["31/12/2025","01/7/2025","01/3/2026","16/7/2026"],"a":2},{"t":"Kê đơn kết hợp thuốc cổ truyền với thuốc hóa dược ngoại trú, phần thuốc hóa dược thực hiện theo:","o":["Không có quy định","TT 26/2025/TT-BYT","TT 55/2025/TT-BYT","TT 23/2011/TT-BYT"],"a":1},{"t":"Thuốc thang có vị thuốc từ dược liệu độc, kê ngoại trú mỗi lần tối đa:","o":["05 ngày","30 ngày","90 ngày","10 ngày"],"a":0},{"t":"Thuốc dược liệu, thuốc cổ truyền dạng bào chế kê ngoại trú tối đa:","o":["30 ngày","120 ngày","60 ngày","90 ngày"],"a":3},{"t":"Kê đơn có trùng lặp vị thuốc và tổng khối lượng vượt liều quy định, người kê đơn phải:","o":["Không được kê","Hội chẩn trước khi kê","Chỉ cần ghi bằng số","Ghi khối lượng bằng số, bằng chữ và ghi “tôi kê liều này”"],"a":3},{"t":"Trình bày các yêu cầu chung về nội dung kê đơn thuốc ngoại trú theo Điều 4 và Điều 6 TT 26/2025.","p":2,"r":"Nguyên tắc phù hợp 1 trong 3 tài liệu; nhiều chuyên khoa kê 1 đơn: 0,3\nThông tin người bệnh: số định danh, nơi cư trú; trẻ dưới 72 tháng ghi tháng tuổi, cân nặng, người đưa trẻ: 0,4\nCách ghi tên thuốc: một hoạt chất theo INN hoặc INN + (tên thương mại); nhiều hoạt chất theo tên thương mại: 0,4\nGhi đủ hàm lượng, số lượng, liều mỗi lần, số lần/ngày, đường dùng, thời điểm, số ngày; thuốc độc ghi trước: 0,3\nSố lượng < 10 thêm số 0; thuốc gây nghiện ghi thêm bằng chữ: 0,3\nSố ngày: ≤ 30 ngày, bệnh Phụ lục VII ≤ 90 ngày; sửa đơn = kê đơn mới: 0,3"},{"t":"So sánh kê đơn thuốc gây nghiện (đơn “N”) và thuốc hướng thần, tiền chất (đơn “H”) theo TT 26/2025: số bản, nơi lưu, số ngày tối đa, yêu cầu đặc biệt.","p":1.5,"r":"Đơn N: 3 bản (lưu cơ sở, bệnh án, nơi cấp bán – có dấu nếu cấp bán ngoài); cấp tính ≤ 7 ngày; ung thư ≤ 30 ngày, 3 đợt ≤ 10 ngày; cam kết 2 bản; danh sách chữ ký mẫu: 0,8\nĐơn H: 3 bản tương tự; cấp tính ≤ 10 ngày; dài ngày ≤ 30 ngày; người bệnh tâm thần, động kinh – người đại diện hoặc trạm y tế lĩnh thuốc: 0,7"},{"t":"Tình huống duyệt đơn ngoại trú: “Bé trai 4 tuổi, không ghi cân nặng; chẩn đoán viêm họng cấp: amoxicilin 250 mg × 30 gói, uống 2 gói/lần × 3 lần/ngày × 5 ngày.” và đơn thứ hai: “Nam 45 tuổi, mất ngủ cấp, tăng huyết áp: diazepam 5 mg × 20 viên, 1 viên tối × 20 ngày (kê trên đơn thông thường); amlodipin 5 mg × 60 viên, 1 viên/ngày × 60 ngày.” Phát hiện lỗi, nêu căn cứ và đề xuất xử trí.","p":1.5,"r":"Đơn 1: trẻ dưới 72 tháng thiếu cân nặng (Điều 6 khoản 4) – yêu cầu bổ sung; kiểm tra liều amoxicilin theo cân nặng: 0,5\nĐơn 2 – diazepam: thuốc hướng thần phải kê đơn “H”, bệnh cấp tính ≤ 10 ngày (Điều 9) – đề nghị kê lại: 0,5\nĐơn 2 – amlodipin 60 ngày: KHÔNG sai vì tăng huyết áp thuộc Phụ lục VII (≤ 90 ngày); học viên nhận định sai là lỗi bị trừ điểm: 0,5"}]},{"no":9,"title":"Thông tin thuốc và giám sát phản ứng có hại của thuốc","milestone":"M4","q":[{"t":"Bước đầu tiên khi trả lời một câu hỏi thông tin thuốc:","o":["Làm rõ câu hỏi và bối cảnh người bệnh","Chuyển câu hỏi cho bác sĩ khác","Tra cứu ngay trên mạng","Trả lời theo kinh nghiệm"],"a":0},{"t":"Người giới thiệu thuốc phải có trình độ tối thiểu (TT 31/2025):","o":["Không yêu cầu","Đại học dược","Trung cấp","Cao đẳng chuyên ngành y, dược"],"a":3},{"t":"Người giới thiệu thuốc KHÔNG được:","o":["Cung cấp thông tin ghi trên nhãn, tờ HDSD","Báo cáo ADR thu thập được về cơ sở kinh doanh","Tiếp cận người bệnh, hồ sơ bệnh án, đơn thuốc","Đeo thẻ người giới thiệu thuốc"],"a":2},{"t":"Bệnh viện chỉ cho phép hoạt động giới thiệu thuốc với người:","o":["Có hợp đồng lao động","Có thẻ và có tên trong danh sách trên trang thông tin của cơ quan y tế tỉnh","Có giấy giới thiệu của công ty","Có bằng dược sĩ"],"a":1},{"t":"Tài liệu thông tin thuốc phải có dòng chữ:","o":["“Tài liệu quảng cáo”","“Lưu hành nội bộ”","“Tài liệu thông tin thuốc” ở đầu tài liệu và đầu mỗi trang","Không bắt buộc"],"a":2},{"t":"Cỡ chữ tối thiểu trong nội dung tài liệu thông tin thuốc (khổ A4):","o":["Cỡ 8","Cỡ 12","Cỡ 14","Cỡ 10"],"a":1},{"t":"Cụm từ bị cấm dùng trong thông tin thuốc (Điều 20 TT 31/2025):","o":["“Chỉ định”","“Liều dùng”","“Chống chỉ định”","“Chuyên trị”"],"a":3},{"t":"Trước khi tổ chức hội thảo giới thiệu thuốc phải thông báo cơ quan y tế tỉnh ít nhất:","o":["02 ngày làm việc","01 ngày","07 ngày","Không cần thông báo"],"a":0},{"t":"Khi thông tin giữa các tài liệu chưa thống nhất, thông tin thuốc dựa trên:","o":["Thông tin trên mạng","Tài liệu của hãng","Tờ HDSD đã được Bộ Y tế phê duyệt","Ý kiến chuyên gia"],"a":2},{"t":"QĐ 29/QĐ-BYT năm 2022 bãi bỏ:","o":["TT 23/2011/TT-BYT","QĐ 1088/QĐ-BYT năm 2013","QĐ 5631/QĐ-BYT","QĐ 3809/QĐ-BYT"],"a":1},{"t":"Phương pháp nào thuộc giám sát ADR tích cực?","o":["Bộ công cụ tín hiệu (trigger tool)","Kiểm tra lại thuốc thực tế người bệnh đã dùng","Ghi nhận biểu hiện bất thường khi chăm sóc hằng ngày","Hỏi tiền sử dị ứng"],"a":0},{"t":"Kê vitamin K cho người bệnh đang dùng warfarin là tín hiệu gợi ý:","o":["Xuất huyết não","Suy gan","Thiếu vitamin do ăn uống","Quá liều thuốc kháng vitamin K"],"a":3},{"t":"Kê flumazenil là tín hiệu gợi ý:","o":["An thần quá mức do benzodiazepin","Quá liều opioid","Hạ đường huyết do insulin","Quá liều heparin"],"a":0},{"t":"Kê natri polystyren sulfonat là tín hiệu gợi ý:","o":["Hạ kali máu","Tăng kali máu","Hạ natri máu","Tăng canxi máu"],"a":1},{"t":"Phương pháp tin cậy và hiệu quả nhất để phát hiện sai sót trong cấp phát, sử dụng thuốc:","o":["Rà soát toàn bộ bệnh án","Bộ công cụ tín hiệu","Quan sát trực tiếp tại giường bệnh","Báo cáo tự nguyện"],"a":2},{"t":"Người trực tiếp viết báo cáo ADR:","o":["Chỉ dược sĩ lâm sàng","Chỉ trưởng khoa","Chỉ bác sĩ điều trị","Bác sĩ, dược sĩ, điều dưỡng, hộ sinh, kỹ thuật viên và nhân viên y tế khác"],"a":3},{"t":"Trường hợp nào KHÔNG thuộc nhóm ưu tiên báo cáo ADR?","o":["ADR của thuốc mới sử dụng tại cơ sở","ADR nghiêm trọng","ADR nhẹ, đã biết, ở người trưởng thành dùng thuốc lâu năm","ADR ở trẻ em, phụ nữ có thai"],"a":2},{"t":"Báo cáo ADR gây tử vong, đe dọa tính mạng gửi không muộn hơn:","o":["3 ngày làm việc","30 ngày","15 ngày làm việc","7 ngày làm việc"],"a":3},{"t":"Báo cáo ADR nghiêm trọng khác gửi không muộn hơn:","o":["15 ngày làm việc","Ngày 5 tháng sau","30 ngày","7 ngày làm việc"],"a":0},{"t":"Báo cáo ADR không nghiêm trọng:","o":["Không cần gửi","Tập hợp gửi hằng tháng, trước ngày 5 tháng kế tiếp","Gửi trước ngày 15/01","Gửi hằng quý"],"a":1},{"t":"Khi thông tin về ADR chưa đầy đủ:","o":["Vẫn gửi báo cáo ban đầu, bổ sung sau","Không gửi","Chỉ lưu tại khoa","Chờ đủ thông tin mới gửi"],"a":0},{"t":"Nguyên tắc điền mẫu báo cáo ADR:","o":["Viết tắt tên thuốc cho gọn","Mỗi khoa một báo cáo/tháng","Gộp nhiều người bệnh cùng thuốc vào một báo cáo","Mỗi người bệnh một báo cáo riêng"],"a":3},{"t":"Theo thang Naranjo, tổng điểm 5–8 tương ứng mức:","o":["Nghi ngờ","Có khả năng","Có thể","Chắc chắn"],"a":1},{"t":"Mức độ nặng của biến cố bất lợi theo CTCAE được chia thành:","o":["3 mức","4 mức","5 mức","6 mức"],"a":2},{"t":"Theo NCC MERP, sai sót đã tới người bệnh, không gây hại nhưng cần theo dõi hoặc can thiệp để loại trừ tác hại thuộc:","o":["Loại B","Loại E","Loại C","Loại D"],"a":3},{"t":"Trình bày 6 nhiệm vụ giám sát ADR tại cơ sở khám, chữa bệnh theo QĐ 29/QĐ-BYT và so sánh hai cách phát hiện ADR (thường quy và giám sát tích cực).","p":2,"r":"6 nhiệm vụ: phân công bộ phận/người phụ trách; xây dựng, triển khai quy trình; phát hiện; báo cáo; đánh giá; dự phòng – 0,15/ý (0,9)\nThường quy: ghi nhận biểu hiện bất thường, rà thuốc thực tế, tiền sử dị ứng, liều, thời điểm, diễn biến khi ngừng/tái dùng: 0,5\nGiám sát tích cực: có chủ đích; trigger tool; rà soát toàn bộ bệnh án; quan sát trực tiếp; hoạt động DSLS – ưu, nhược điểm chính: 0,6"},{"t":"Nêu các trường hợp ưu tiên báo cáo ADR và thời hạn gửi báo cáo theo QĐ 29/QĐ-BYT.","p":1.5,"r":"Ưu tiên (0,1/ý, tối đa 0,7): nghiêm trọng (kể cả phản vệ theo TT 51/2017, tai biến nặng sau tiêm chủng); trẻ em, người cao tuổi, PNCT, cho con bú; thuốc mới; ADR mới; liên tiếp với một thuốc/lô; thất bại điều trị; tương tác, quá liều\nThời hạn: tử vong/đe dọa tính mạng ≤ 7 ngày làm việc; nghiêm trọng khác ≤ 15 ngày làm việc; không nghiêm trọng gửi gộp trước ngày 5 tháng sau: 0,6\nGửi sớm cả khi chưa đủ thông tin, bổ sung sau: 0,2"},{"t":"Tình huống: Nam 60 tuổi điều trị viêm phổi nội trú. Sau 2 ngày dùng ceftriaxon xuất hiện ban đỏ toàn thân, ngứa, không khó thở, huyết áp ổn định. Bác sĩ ngừng ceftriaxon, dùng kháng histamin; 2 ngày sau ban giảm rõ. Người bệnh ra viện đúng dự kiến. (a) Phản ứng có nghiêm trọng không, thời hạn gửi báo cáo? (b) Chấm Naranjo sơ bộ và kết luận. (c) Nêu 4 nhóm thông tin tối thiểu của báo cáo.","p":1.5,"r":"(a) Không nghiêm trọng (không tử vong, không đe dọa tính mạng, không kéo dài nằm viện) → gửi gộp trước ngày 5 tháng sau; chấp nhận lập luận nếu nêu điều kiện kéo dài nằm viện thì thành nghiêm trọng (≤ 15 ngày làm việc): 0,5\n(b) Có y văn ghi nhận (+1), xuất hiện sau dùng thuốc (+2), cải thiện khi ngừng (+1), các câu thiếu thông tin = 0 → khoảng 4 điểm: “có thể”; nếu loại trừ được nguyên nhân khác (+2) → 6: “có khả năng”: 0,5\n(c) Thông tin người bệnh; mô tả phản ứng; thuốc nghi ngờ; người/đơn vị báo cáo: 0,5"}]},{"no":10,"title":"Quy trình DLS trên người bệnh: tim mạch, đái tháo đường","milestone":"M5","q":[{"t":"Thứ tự đúng của quy trình DLS trên người bệnh:","o":["Thu thập thông tin → xác định vấn đề → đề xuất can thiệp → theo dõi","Theo dõi → đề xuất → thu thập → xác định vấn đề","Đề xuất → thu thập → theo dõi → xác định vấn đề","Xác định vấn đề → theo dõi → thu thập → đề xuất"],"a":0},{"t":"Công thức Cockcroft-Gault với creatinin tính bằng µmol/L:","o":["ClCr = (100 − tuổi) × cân nặng / (72 × creatinin)","ClCr = (140 − tuổi) × chiều cao / creatinin","ClCr = (140 − tuổi) × cân nặng / (0,814 × creatinin)","ClCr = cân nặng × creatinin / (140 − tuổi)"],"a":2},{"t":"Khi tính ClCr cho người bệnh nữ, nhân kết quả với:","o":["1,23","0,9","0,75","0,85"],"a":3},{"t":"Nam 70 tuổi, 70 kg, creatinin 120 µmol/L. ClCr xấp xỉ:","o":["70 ml/phút","50 ml/phút","60 ml/phút","40 ml/phút"],"a":1},{"t":"Nữ 80 tuổi, 50 kg, creatinin 100 µmol/L. ClCr xấp xỉ:","o":["37 ml/phút","25 ml/phút","31 ml/phút","45 ml/phút"],"a":2},{"t":"Mục tiêu HbA1c chung cho người trưởng thành mắc ĐTĐ, không có thai (QĐ 3809):","o":["< 7%","< 6%","< 8%","< 9%"],"a":0},{"t":"Mục tiêu glucose huyết tương mao mạch lúc đói, trước ăn:","o":["7,0–10,0 mmol/L","4,4–7,2 mmol/L","3,9–5,5 mmol/L","< 11,1 mmol/L"],"a":1},{"t":"Mục tiêu HbA1c < 8% phù hợp với người bệnh:","o":["Chỉ dùng metformin, không bệnh tim mạch","Phụ nữ có thai","Trẻ tuổi, mới mắc bệnh","Cao tuổi, tiền sử hạ đường huyết nặng, nhiều bệnh kèm"],"a":3},{"t":"Metformin khi mức lọc cầu thận < 30 ml/phút/1,73 m²:","o":["Chống chỉ định","Giảm một nửa liều","Không cần chỉnh liều","Tăng liều"],"a":0},{"t":"Người bệnh chưa dùng metformin, mức lọc cầu thận 30–45 ml/phút/1,73 m²:","o":["Khởi đầu bình thường, không theo dõi","Ưu tiên khởi đầu metformin","Không khuyến cáo khởi đầu điều trị","Khởi đầu liều đầy đủ"],"a":2},{"t":"Thuốc nào làm tăng glucose huyết (QĐ 3809 Bảng 2.5)?","o":["Gliclazid","Insulin","Thuốc ức chế men chuyển","Glucocorticoid"],"a":3},{"t":"Thuốc chẹn beta nào KHÔNG ghi nhận làm tăng glucose huyết lúc đói theo QĐ 3809?","o":["Atenolol","Carvedilol","Propranolol","Metoprolol"],"a":1},{"t":"HA tâm thu mục tiêu cho người 18–64 tuổi tăng huyết áp (không kèm bệnh thận mạn):","o":["130–140 mmHg","120–130 mmHg","< 150 mmHg","< 160 mmHg"],"a":1},{"t":"HA tâm thu mục tiêu cho người ≥ 65 tuổi:","o":["< 120 mmHg","120–130 mmHg","< 150 mmHg","130 – < 140 mmHg"],"a":3},{"t":"HA tâm trương mục tiêu:","o":["70 – < 80 mmHg","80–90 mmHg","< 90 mmHg","60–70 mmHg"],"a":0},{"t":"Phối hợp thuốc được ưu tiên khi khởi đầu điều trị THA:","o":["ƯCMC + chẹn thụ thể angiotensin","Hai thuốc chẹn beta","ƯCMC hoặc chẹn thụ thể angiotensin + chẹn kênh canxi hoặc lợi tiểu","Hai thuốc lợi tiểu thiazid"],"a":2},{"t":"Phối hợp KHÔNG được khuyến cáo trong điều trị THA:","o":["ƯCMC với chẹn thụ thể angiotensin","Chẹn thụ thể angiotensin với lợi tiểu","Chẹn kênh canxi với lợi tiểu","ƯCMC với chẹn kênh canxi"],"a":0},{"t":"HA không kiểm soát với 3 thuốc (ƯCMC/CTTA + CKCa + LT), thuốc nên thêm:","o":["Digoxin","Thêm một thuốc ƯCMC khác","Spironolacton","Nifedipin kèm amlodipin"],"a":2},{"t":"Thuốc làm nặng suy tim do giữ muối, nước:","o":["Spironolacton","NSAID","Furosemid","Bisoprolol"],"a":1},{"t":"Thuốc có tác dụng inotrope âm tính, cần tránh ở người suy tim:","o":["Amlodipin","Furosemid","Digoxin","Verapamil"],"a":3},{"t":"Thang điểm đánh giá nguy cơ đột quỵ ở người bệnh rung nhĩ:","o":["CHA₂DS₂-VASc","NYHA","Child-Pugh","HAS-BLED"],"a":0},{"t":"Thang điểm đánh giá nguy cơ chảy máu khi dùng thuốc chống đông:","o":["CHA₂DS₂-VASc","HAS-BLED","CTCAE","Naranjo"],"a":1},{"t":"Phối hợp làm tăng nguy cơ tăng kali máu:","o":["Amlodipin + atorvastatin","Metformin + gliclazid","Enalapril + spironolacton","Furosemid + bisoprolol"],"a":2},{"t":"Phiếu khai thác tiền sử bệnh và dùng thuốc ở người bệnh THA trong QĐ 3809:","o":["Bảng 2.8","Bảng 3.14","Bảng 3.21","Bảng 3.7"],"a":3},{"t":"Trong cấu trúc SBAR, chữ “R” là:","o":["Đánh giá","Tình huống","Đề xuất (Recommendation)","Bối cảnh"],"a":2},{"t":"Trình bày quy trình 4 bước thực hành DLS trên người bệnh và các phiếu, bảng của QĐ 3809 dùng cho người bệnh đái tháo đường và tăng huyết áp.","p":2,"r":"4 bước, mỗi bước nêu nội dung chính (thu thập thông tin; xác định vấn đề theo 6 điểm, Bảng 1.3; đề xuất, trao đổi, ghi nhận; theo dõi hiệu quả, ADR, tư vấn ra viện): 0,3/bước (1,2)\nĐTĐ: Bảng 2.8 phỏng vấn tiền sử, 2.9 kế hoạch, 2.10 theo dõi: 0,4\nTHA: Bảng 3.7 khai thác tiền sử, 3.10 kế hoạch, 3.11 theo dõi: 0,4"},{"t":"Nêu huyết áp mục tiêu theo nhóm tuổi và các nguyên tắc dùng thuốc điều trị tăng huyết áp theo QĐ 3809.","p":1.5,"r":"HA mục tiêu: 18–64 tuổi 120–130 (kèm bệnh thận mạn 130–<140); ≥ 65 tuổi 130–<140; tâm trương 70–<80: 0,5\nNguyên tắc (0,2/ý, tối đa 1,0): 5 nhóm thuốc chính; khởi đầu phối hợp 2 thuốc, ưu tiên viên phối hợp; ưu tiên ƯCMC/CTTA + CKCa hoặc LT; đơn trị cho người cao tuổi lão hóa, THA độ 1 nguy cơ thấp; 3 thuốc chưa đạt thêm spironolacton; không phối hợp ƯCMC + CTTA; chẹn beta khi đau thắt ngực, sau NMCT, suy tim"},{"t":"Tình huống: Nam 74 tuổi, 60 kg, THA, ĐTĐ typ 2, creatinin 160 µmol/L; đang dùng metformin 1 g × 2 lần/ngày, enalapril 10 mg/ngày, spironolacton 25 mg/ngày, ibuprofen 400 mg × 3 lần/ngày. Tính ClCr, nêu các vấn đề liên quan đến thuốc và viết một đề xuất theo SBAR gửi bác sĩ.","p":1.5,"r":"ClCr = 66 × 60 / (0,814 × 160) ≈ 30 ml/phút: 0,3\nVấn đề: metformin 2 g/ngày không phù hợp với chức năng thận (≈ 30) – nguy cơ nhiễm toan lactic; nguy cơ tăng kali (enalapril + spironolacton + NSAID); NSAID làm giảm chức năng thận, tăng HA: 0,6\nSBAR đủ 4 phần, có số liệu (ClCr, K+), đề xuất cụ thể (ngừng/thay metformin, thay ibuprofen bằng paracetamol, kiểm tra kali, creatinin) kèm nguồn: 0,6"}]},{"no":11,"title":"Quản lý sử dụng kháng sinh trong bệnh viện","milestone":"M6","q":[{"t":"Nội dung nào KHÔNG thuộc 5 mục tiêu của chương trình quản lý sử dụng kháng sinh?","o":["Giảm biến cố bất lợi","Giảm xuất hiện vi sinh vật kháng thuốc","Nâng cao hiệu quả điều trị nhiễm trùng","Tăng doanh thu thuốc kháng sinh"],"a":3},{"t":"Chương trình quản lý sử dụng kháng sinh trong bệnh viện có bao nhiêu nhiệm vụ cốt lõi?","o":["8","5","6","4"],"a":2},{"t":"Trưởng Ban quản lý sử dụng kháng sinh là:","o":["Lãnh đạo bệnh viện","Trưởng khoa Dược","Trưởng phòng Kế hoạch tổng hợp","Bác sĩ vi sinh"],"a":0},{"t":"Dược sĩ tham gia Ban quản lý sử dụng kháng sinh ưu tiên là:","o":["Thống kê dược","Dược sĩ làm công tác dược lâm sàng","Bất kỳ dược sĩ nào","Thủ kho"],"a":1},{"t":"Nhóm chuyên trách giám sát – phản hồi thường gồm:","o":["1 bác sĩ và 1 dược sĩ làm công tác lâm sàng","3 bác sĩ","2 dược sĩ","1 điều dưỡng"],"a":0},{"t":"Kháng sinh ưu tiên quản lý Nhóm 1 là:","o":["Kháng sinh uống phổ hẹp","Kháng sinh dự trữ, lựa chọn cuối cùng, cho nhiễm khuẩn đa kháng, độc tính cao","Kháng sinh dùng ngoài da","Kháng sinh lựa chọn đầu tay"],"a":1},{"t":"Thuốc nào thuộc danh mục Nhóm 1 tham khảo (Phụ lục 2 QĐ 5631)?","o":["Amoxicilin","Cefuroxim uống","Doxycyclin","Colistin"],"a":3},{"t":"Thuốc kháng nấm thuộc danh mục Nhóm 1 tham khảo:","o":["Fluconazol uống","Clotrimazol","Caspofungin","Nystatin"],"a":2},{"t":"Thời điểm duyệt kháng sinh Nhóm 1 trong trường hợp thông thường:","o":["Sau 7 ngày","Sau 72 giờ sử dụng","Không cần duyệt","Trước khi sử dụng"],"a":3},{"t":"Duyệt kháng sinh Nhóm 1 trong trường hợp cấp cứu, ngoài giờ hành chính:","o":["Trong 6 giờ","Không cần duyệt","Trong vòng 24–48 giờ","Trong 7 ngày"],"a":2},{"t":"Thời gian sử dụng kháng sinh Nhóm 1 cho mỗi lần duyệt tối đa:","o":["7 ngày","14 ngày","10 ngày","21 ngày"],"a":1},{"t":"Người được ưu tiên ủy quyền duyệt kháng sinh Nhóm 1:","o":["Dược sĩ DLS, bác sĩ hồi sức tích cực hoặc bác sĩ có kinh nghiệm điều trị nhiễm trùng","Thủ kho","Bác sĩ điều trị tự duyệt","Điều dưỡng trưởng"],"a":0},{"t":"Khi người duyệt có ý kiến khác bác sĩ điều trị:","o":["Dược sĩ quyết định","Hai bên trao đổi, thống nhất dựa trên tình trạng lâm sàng người bệnh","Ngừng thuốc ngay","Bác sĩ bỏ qua ý kiến"],"a":1},{"t":"Kháng sinh Nhóm 2 là nhóm:","o":["Bị cấm sử dụng","Phải phê duyệt trước khi dùng","Cần theo dõi, giám sát tiêu thụ và đề kháng","Chỉ dùng ngoại trú"],"a":2},{"t":"Nội dung nào KHÔNG thuộc 3 chiến lược cốt lõi quản lý kháng sinh?","o":["Phê duyệt trước khi sử dụng","Can thiệp tại khoa lâm sàng","Giám sát – phản hồi","Cấm toàn bộ kháng sinh đường tiêm"],"a":3},{"t":"Rà soát để áp dụng liệu pháp xuống thang sau khi khởi đầu kháng sinh:","o":["48–72 giờ hoặc khi có kết quả vi sinh","14 ngày","24 giờ","7 ngày"],"a":0},{"t":"Nội dung nào KHÔNG thuộc liệu pháp xuống thang?","o":["Chuyển sang phác đồ hướng theo vi sinh vật đã xác định","Bổ sung thêm kháng sinh phổ rộng","Ngừng kháng sinh kinh nghiệm khi không đủ bằng chứng nhiễm khuẩn","Ngừng kháng sinh phối hợp không còn cần thiết"],"a":1},{"t":"Lấy bệnh phẩm vi sinh nên thực hiện:","o":["Sau 7 ngày điều trị","Không cần thiết","Trước khi khởi đầu kháng sinh, nếu điều kiện cho phép","Khi thất bại điều trị"],"a":2},{"t":"Tiêu chí chuyển kháng sinh tiêm sang uống:","o":["Không sốt (< 38,3 °C) ít nhất 24 giờ","Huyết áp tụt cần vận mạch","Sốt 39 °C","Nôn liên tục"],"a":0},{"t":"Trường hợp nào KHÔNG nên chuyển sang kháng sinh đường uống sớm?","o":["Viêm phổi cộng đồng đã ổn định","Nhiễm khuẩn tiết niệu đáp ứng tốt","Nhiễm khuẩn da mô mềm nhẹ đã cải thiện","Viêm nội tâm mạc nhiễm khuẩn"],"a":3},{"t":"Tiêu chí huyết áp khi xem xét chuyển kháng sinh tiêm sang uống:","o":["HA tâm thu < 90 mmHg","HA tâm thu > 90 mmHg, không dùng vận mạch","HA tâm thu > 140 mmHg","Không quan tâm huyết áp"],"a":1},{"t":"Chỉ số “cần thực hiện” khi giám sát tiêu thụ kháng sinh:","o":["DDD/100 (hoặc 1.000) ngày nằm viện","Tỷ lệ chuyển tiêm sang uống","DOT","LOT"],"a":0},{"t":"Chỉ số thuộc nhóm “khuyến khích thực hiện”:","o":["Tỷ lệ % người bệnh được kê kháng sinh","DDD/100 ngày nằm viện","Tỷ lệ % cấy dương tính","DOT – số ngày điều trị kháng sinh"],"a":3},{"t":"Bệnh viện có khoa vi sinh tổng kết mức độ đề kháng kháng sinh tối thiểu:","o":["5 năm/lần","Không bắt buộc","1 năm/lần","3 tháng/lần"],"a":2},{"t":"Kháng sinh ưu tiên tối ưu liều dựa trên nồng độ thuốc trong máu:","o":["Doxycyclin","Aminoglycosid, vancomycin","Amoxicilin","Cephalexin"],"a":1},{"t":"Trình bày 6 nhiệm vụ cốt lõi của chương trình quản lý sử dụng kháng sinh và thành phần Ban quản lý sử dụng kháng sinh theo QĐ 5631/QĐ-BYT.","p":2,"r":"6 nhiệm vụ: thành lập Ban; xây dựng quy định; giám sát sử dụng và đề kháng; can thiệp; đào tạo; đánh giá, báo cáo, phản hồi – 0,2/ý (1,2)\nThành phần: trưởng ban lãnh đạo BV; thành viên chính: bác sĩ lâm sàng, dược sĩ (ưu tiên DSLS), vi sinh, KSNK, KHTH, QLCL; thành viên khác: điều dưỡng, CNTT: 0,8"},{"t":"Phân biệt kháng sinh Nhóm 1 và Nhóm 2; trình bày quy định duyệt kháng sinh Nhóm 1.","p":1.5,"r":"Nhóm 1: dự trữ, lựa chọn cuối, đa kháng, độc tính cao – phải phê duyệt; Nhóm 2: theo dõi, giám sát tiêu thụ, đề kháng: 0,5\nDuyệt: trước khi dùng; cấp cứu/ngoài giờ trong 24–48 giờ; ≤ 14 ngày mỗi lần duyệt rồi đánh giá lại; phiếu yêu cầu (Phụ lục 4): 0,6\nNgười duyệt ưu tiên DSLS, BS hồi sức, BS nhiễm khuẩn; bất đồng thì trao đổi, thống nhất: 0,4"},{"t":"Tình huống: Nữ 55 tuổi, viêm phổi cộng đồng, ngày thứ 4 dùng ceftriaxon 2 g/ngày + levofloxacin 750 mg/ngày đường tĩnh mạch. Hết sốt 48 giờ (37,2 °C), HA 120/70 mmHg, ăn uống được, không nôn. Cấy đờm: Streptococcus pneumoniae nhạy ceftriaxon, levofloxacin, amoxicilin. Em đề xuất gì? Nêu căn cứ.","p":1.5,"r":"Xuống thang: ngừng một trong hai kháng sinh khi không còn cần phối hợp, chuyển phác đồ hướng theo vi sinh vật đã xác định (rà soát sau 48–72 giờ, khi có kết quả vi sinh): 0,6\nChuyển đường uống: đáp ứng tiêu chí Phụ lục 5 (HATT > 90 không vận mạch, không sốt ≥ 24 giờ, dung nạp đường uống, không thuộc nhiễm khuẩn cần tiêm kéo dài) – đề xuất kháng sinh uống nhạy cảm, ví dụ amoxicilin liều phù hợp: 0,6\nTrao đổi với bác sĩ, ghi nhận kết quả can thiệp; theo dõi lâm sàng sau chuyển: 0,3"}]},{"no":12,"title":"Tư vấn người bệnh, bình bệnh án và chuyên đề cuối khóa","milestone":"M6","q":[{"t":"Bước đầu tiên trong cấu trúc 5 bước tư vấn người bệnh ra viện:","o":["Yêu cầu người bệnh nhắc lại","Hẹn tái khám","Mở đầu: giới thiệu, mục đích, thời gian","Hướng dẫn liều dùng"],"a":2},{"t":"Bước thứ hai của cấu trúc tư vấn 5 bước:","o":["Hướng dẫn tác dụng phụ","Hỏi người bệnh đã biết gì về thuốc","Hẹn theo dõi","Chào kết thúc"],"a":1},{"t":"Mục đích của việc yêu cầu người bệnh tự nói lại hoặc làm lại:","o":["Kiểm tra mức độ hiểu và làm đúng của người bệnh","Ghi âm buổi tư vấn","Kéo dài thời gian tư vấn","Thủ tục hành chính"],"a":0},{"t":"Câu hỏi kiểm tra hiểu biết tốt nhất:","o":["“Bác có gì hỏi không?”","“Bác hiểu chưa?”","“Bác nhớ chưa?”","“Bác sẽ uống thuốc này thế nào khi về nhà?”"],"a":3},{"t":"Hoạt động phối hợp với người hành nghề để tư vấn người bệnh được quy định tại:","o":["Điều 6 khoản 7 NĐ 131/2020","Điều 10 NĐ 131/2020","Điều 7 khoản 4 NĐ 131/2020","Điều 3 NĐ 131/2020"],"a":2},{"t":"Bảng kiểm tư vấn sử dụng insulin dạng bút tiêm trong QĐ 3809:","o":["Phụ lục 2.5","Phụ lục 2.2","Phụ lục 4.8","Phụ lục 3.9"],"a":0},{"t":"Thời gian bảo quản insulin sau khi mở nắp tra cứu tại QĐ 3809:","o":["Phụ lục 2.5","Phụ lục 3.3","Phụ lục 4.3","Phụ lục 2.2"],"a":3},{"t":"Hiệu quả điều trị bằng warfarin được theo dõi qua:","o":["HbA1c","INR","Creatinin","Men gan"],"a":1},{"t":"Lời khuyên về chế độ ăn cho người dùng warfarin:","o":["Giữ lượng rau xanh ổn định hằng ngày","Kiêng hoàn toàn rau xanh","Ăn nhiều rau xanh đột ngột","Uống thêm vitamin K"],"a":0},{"t":"Dấu hiệu cần đến viện ngay khi đang dùng thuốc chống đông:","o":["Khô miệng","Đi ngoài phân đen","Tăng cân nhẹ","Ăn ngon miệng hơn"],"a":1},{"t":"Người đang dùng thuốc chống đông bị đau đầu nhẹ, lời khuyên đúng:","o":["Tự dùng aspirin","Tự dùng ibuprofen","Tạm ngừng thuốc chống đông","Hỏi dược sĩ, tránh tự dùng NSAID hoặc aspirin"],"a":3},{"t":"Phiếu thông tin cho người bệnh dùng thuốc kháng đông trong QĐ 3809:","o":["Phụ lục 4.19","Phụ lục 3.3","Phụ lục 3.9","Phụ lục 2.5"],"a":2},{"t":"Thời lượng chuẩn của một ca bình bệnh án trong lộ trình:","o":["5 phút","30 phút","15 phút","60 phút"],"a":2},{"t":"Hai phần chiếm nhiều thời gian nhất trong ca bình bệnh án:","o":["Đọc lại toàn bộ bệnh án","Giới thiệu và cảm ơn","Tóm tắt ca và bài học","Vấn đề thuốc và can thiệp (mỗi phần 5 phút)"],"a":3},{"t":"Tiêu chí “căn cứ” khi chấm ca bình bệnh án:","o":["Dẫn nguồn đúng, văn bản và hướng dẫn còn hiệu lực","Slide nhiều hình ảnh","Số trang trình bày","Nói to, rõ"],"a":0},{"t":"Nữ 68 tuổi, 52 kg, creatinin 130 µmol/L. ClCr xấp xỉ:","o":["20 ml/phút","30 ml/phút","45 ml/phút","35 ml/phút"],"a":1},{"t":"Phối hợp fluoroquinolon với warfarin có thể gây:","o":["Giảm INR","Tăng kali máu","Không có tương tác","Tăng INR, tăng nguy cơ chảy máu"],"a":3},{"t":"Phối hợp fluoroquinolon với sulfonylure cần theo dõi:","o":["Men gan","Rối loạn đường huyết","INR","Kali máu"],"a":1},{"t":"Hoạt động nghiên cứu, phân tích sử dụng thuốc của DLS (căn cứ cho chuyên đề cuối khóa) quy định tại:","o":["Điều 9 TT 22/2011","Điều 10 NĐ 131/2020","Điều 6 khoản 5 và khoản 7 NĐ 131/2020","Điều 3 NĐ 131/2020"],"a":2},{"t":"Đề cương chuyên đề 1 trang gồm:","o":["Câu hỏi, đối tượng, số liệu, cách phân tích, đầu ra dự kiến","Chỉ kết quả dự kiến","Tổng quan tài liệu 20 trang","Chỉ tên đề tài"],"a":0},{"t":"Nguồn số liệu phù hợp khi phân tích sử dụng kháng sinh tại một khoa:","o":["Báo chí","Tài liệu quảng cáo","Dữ liệu HIS và bệnh án","Ý kiến người giới thiệu thuốc"],"a":2},{"t":"Theo lộ trình học việc, đánh giá cuối khóa M6 chiếm:","o":["60% điểm cuối khóa","40%","50%","100%"],"a":0},{"t":"Điều kiện đạt cuối khóa:","o":["≥ 50 điểm","≥ 70 điểm và không có lỗi điểm liệt","≥ 60 điểm","≥ 85 điểm"],"a":1},{"t":"Mức xếp loại Giỏi (giao nhiệm vụ người làm DLS):","o":["≥ 90 điểm","≥ 95 điểm","≥ 80 điểm","≥ 85 điểm"],"a":3},{"t":"Với người bệnh dùng bình xịt định liều, kỹ thuật dùng thuốc nên được kiểm tra:","o":["Không cần kiểm tra","Mỗi lần tái khám","Chỉ lần đầu cấp thuốc","Chỉ khi nhập viện"],"a":1},{"t":"Trình bày cấu trúc 5 bước tư vấn người bệnh ra viện và các nội dung cần tư vấn cho người bệnh.","p":2,"r":"5 bước: mở đầu; hỏi hiểu biết; hướng dẫn; người bệnh nhắc lại/làm lại; hẹn theo dõi – 0,2/bước (1,0)\nNội dung (0,2/ý, tối đa 1,0): tên và mục đích thuốc; liều, thời điểm, thời gian, xử trí quên liều; dấu hiệu ADR cần báo; thuốc tự mua, TPCN, đồ uống cần tránh; bảo quản thuốc; lịch tái khám; ngôn ngữ đơn giản"},{"t":"Trình bày cấu trúc một ca bình bệnh án 15 phút và 5 tiêu chí chấm.","p":1.5,"r":"Cấu trúc: tóm tắt ca 2 phút; vấn đề thuốc xếp ưu tiên 5 phút; can thiệp có bằng chứng, kết quả 5 phút; bài học 3 phút: 0,7\n5 tiêu chí: căn cứ; phân tích; đề xuất; trình bày; tính hữu ích – kèm câu hỏi đánh giá của mỗi tiêu chí: 0,8"},{"t":"Tình huống: Nữ 68 tuổi, 52 kg, viêm phổi cộng đồng, rung nhĩ, ĐTĐ typ 2; creatinin 130 µmol/L. Thuốc: ceftriaxon 2 g/ngày; levofloxacin 750 mg/ngày; warfarin 3 mg/ngày; gliclazid MR 60 mg/ngày; metformin 1 g × 2 lần/ngày. Tính ClCr, nêu các vấn đề liên quan đến thuốc và nội dung cần theo dõi.","p":1.5,"r":"ClCr = (140 − 68) × 52 / (0,814 × 130) × 0,85 ≈ 30 ml/phút: 0,3\nLiều theo thận: levofloxacin 750 mg cần giãn khoảng cách theo ClCr (tra tờ HDSD); metformin với chức năng thận ≈ 30 – đề xuất ngừng: 0,5\nTương tác: levofloxacin + warfarin tăng INR → theo dõi INR, dấu hiệu chảy máu; levofloxacin + gliclazid rối loạn đường huyết → theo dõi glucose: 0,4\nRà soát kháng sinh sau 48–72 giờ: xuống thang, chuyển đường uống khi đạt tiêu chí: 0,3"}]}];

/* =====================================================================
   SHARED: 26-week rail
   ===================================================================== */
function rail(cfg, week, reviews = [], opts = {}) {
  const W = cfg.totalWeeks;
  const bands = cfg.stages.map(s => `<button class="rail-band" style="grid-column:${s.from}/${s.to + 1};background:${stageColor(s.no)}" data-act="${opts.stageAct || "pickStage"}" data-stage="${s.id}" title="Giai đoạn ${s.no}: ${esc(s.name)} (tuần ${s.from}–${s.to})">${s.no}. ${esc(s.name)}</button>`).join("");
  const weeks = Array.from({ length: W }, (_, i) => { const w = i + 1; return `<div class="rail-wk ${week && w < week ? "past" : ""} ${w === week ? "cur" : ""}">${w}</div>`; }).join("");
  const rv = Object.fromEntries(reviews.map(r => [r.milestone, r]));
  const ms = Array.from({ length: W }, (_, i) => {
    const m = cfg.milestones.find(x => x.week === i + 1); if (!m) return `<div class="rail-ms"></div>`;
    const res = rv[m.id] ? msResult(cfg, rv[m.id]) : null;
    return `<div class="rail-ms ${res ? (res.pass ? "ok" : "bad") : ""}" title="${m.id} – ${esc(m.name)} (tuần ${m.week})${res ? (hideSc() ? `: ${res.pass ? "đạt" : "chưa đạt"}` : `: ${res.total} điểm`) : ""}"><span></span></div>`;
  }).join("");
  let now = "";
  if (week == null) now = "Chưa có ngày bắt đầu";
  else if (week === 0) now = "Chưa bắt đầu";
  else if (week > W) now = "Đã hoàn thành 26 tuần";
  else { const st = stageOfWeek(cfg, week); const next = cfg.milestones.find(m => m.week >= week); now = `Tuần ${week}/${W} · Giai đoạn ${st.no}: ${st.name}${next ? ` · Mốc ${next.id} ở tuần ${next.week}` : ""}`; }
  return `<div class="rail"><div class="rail-head"><div class="now">${esc(now)}</div>${opts.right || ""}</div>
    <div class="rail-grid">${bands}</div><div class="rail-grid" style="margin-top:4px">${weeks}</div><div class="rail-grid" style="margin-top:2px">${ms}</div>
    <div class="rail-legend"><span><i></i>Mốc đánh giá</span><span><i style="background:var(--g500);border-color:var(--g500)"></i>Đạt</span><span><i style="background:var(--red);border-color:var(--red)"></i>Chưa đạt</span></div></div>`;
}

function taskStats(cfg, prog, week) {
  let total = 0, done = 0, doing = 0, todo = 0;
  cfg.stages.forEach(s => taskIds(s).forEach(id => { total++; if (prog?.tasks?.[id]) done++; else if (week && s.from <= week) doing++; else todo++; }));
  return { total, done, doing, todo, pct: total ? Math.round(done * 100 / total) : 0 };
}
function nextTask(cfg, prog, week) {
  const order = cfg.stages.filter(s => !week || s.from <= Math.max(week, 1)).concat(cfg.stages.filter(s => week && s.from > week));
  for (const s of order) {
    const i = s.items.findIndex((_, k) => !prog?.tasks?.[`${s.id}_i${k}`]); if (i >= 0) return { st: s, text: s.items[i].content, sub: `Tuần ${s.items[i].w}`, dls: s.items[i].dls };
    const j = s.products.findIndex((_, k) => !prog?.tasks?.[`${s.id}_p${k}`]); if (j >= 0) return { st: s, text: "Nộp sản phẩm: " + s.products[j], sub: "Sản phẩm cuối giai đoạn" };
  }
  return null;
}

let examTimer = null;
async function vTakeExam(examId) {
  clearInterval(examTimer);
  const uid = S.user.uid; const aid = `${examId}_${uid}`;
  const exam = await Store.get("exams", examId).catch(() => null);
  if (!exam) return `<div class="empty">Bài lượng giá không tồn tại hoặc đã đóng.</div>`;
  let att = await Store.get("attempts", aid).catch(() => null);
  if (att?.status === "da-nop") return `<h1>${esc(exam.title)}</h1><div class="empty">Bạn đã nộp bài lúc ${fmtDT(att.submittedAt)}. Kết quả hiện khi lãnh đạo khoa chấm xong.</div>`;
  const qs = exam.shuffle ? seededShuffle(exam.questions, uid + examId) : exam.questions;
  if (att?.status === "da-cham" && hideSc()) {
    const body = qs.map((q, i) => {
      const ans = att.answers?.[q.id];
      if (q.type === "mcq") return `<div class="q"><div class="qn">Câu ${i + 1} · trắc nghiệm</div><div>${nl(q.text)}</div>${q.options.map((o, k) => `<div class="opt"><input type="radio" disabled ${ans === k ? "checked" : ""}><span>${esc(o)}</span></div>`).join("")}</div>`;
      return `<div class="q"><div class="qn">Câu ${i + 1} · tự luận</div><div>${nl(q.text)}</div><div class="dls" style="margin-top:8px">${nl(ans || "(không trả lời)")}</div>${att.essayComments?.[q.id] ? `<p class="small" style="margin-top:8px"><b>Nhận xét:</b> ${nl(att.essayComments[q.id])}</p>` : ""}</div>`;
    }).join("");
    return `<h1>${esc(exam.title)}</h1><div class="panel"><b>Bài đã được chấm</b><div class="small muted">${esc(att.gradedByName || "")} · ${fmtDT(att.gradedAt)} · Điểm do lãnh đạo khoa quản lý, trao đổi trực tiếp với người hướng dẫn nếu cần.</div></div>${att.generalComment ? `<div class="panel"><b>Nhận xét chung:</b> ${nl(att.generalComment)}</div>` : ""}${body}<a class="btn ghost" href="#/luonggia">Về danh sách</a>`;
  }
  if (att?.status === "da-cham") {
    const body = qs.map((q, i) => {
      const ans = att.answers?.[q.id];
      if (q.type === "mcq") {
        const ok = att.mcqResult?.[q.id];
        return `<div class="q"><div class="qn">Câu ${i + 1} · trắc nghiệm · ${q.points} điểm · ${ok ? "đúng" : "sai"}</div><div>${nl(q.text)}</div>${q.options.map((o, k) => `<div class="opt ${ans === k ? (ok ? "right" : "wrong") : ""}"><input type="radio" disabled ${ans === k ? "checked" : ""}><span>${esc(o)}</span></div>`).join("")}</div>`;
      }
      return `<div class="q"><div class="qn">Câu ${i + 1} · tự luận · ${att.essayScores?.[q.id] ?? 0}/${q.points} điểm</div><div>${nl(q.text)}</div><div class="dls" style="margin-top:8px">${nl(ans || "(không trả lời)")}</div>${att.essayComments?.[q.id] ? `<p class="small" style="margin-top:8px"><b>Nhận xét:</b> ${nl(att.essayComments[q.id])}</p>` : ""}</div>`;
    }).join("");
    return `<h1>${esc(exam.title)}</h1><div class="panel row"><div class="score">${att.percent}%</div><div><b>${att.total}/${att.maxTotal} điểm</b><div class="small muted">Chấm bởi ${esc(att.gradedByName || "")} · ${fmtDT(att.gradedAt)}</div></div></div>${att.generalComment ? `<div class="panel"><b>Nhận xét chung:</b> ${nl(att.generalComment)}</div>` : ""}${body}<a class="btn ghost" href="#/luonggia">Về danh sách</a>`;
  }
  if (!exam.open) return `<div class="empty">Bài lượng giá này đã đóng.</div>`;
  const w = examWindow(exam);
  if (!att && w.k === "soon") return `<h1>${esc(exam.title)}</h1><div class="empty">Bài sẽ mở lúc <b>${fmtMs(exam.openFromMs)}</b>. Thời gian làm bài ${exam.durationMin} phút.</div>`;
  if (!att && w.k === "over") return `<h1>${esc(exam.title)}</h1><div class="empty">Đã quá hạn chót (${fmtMs(exam.openToMs)}).</div>`;
  if (!att) {
    if (!confirm(`Bắt đầu làm "${exam.title}"?\nThời gian: ${exam.durationMin} phút${exam.openToMs ? `, hạn chót ${fmtMs(exam.openToMs)}` : ""}. Đồng hồ chạy ngay khi bắt đầu và bài tự nộp khi hết giờ.`)) { location.hash = "#/luonggia"; return ""; }
    att = { examId, examTitle: exam.title, milestone: exam.milestone, learnerUid: uid, learnerName: S.me.name, answers: {}, status: "dang-lam", startedAt: nowISO() };
    await Store.set("attempts", aid, att, false);
  }
  let end = new Date(att.startedAt).getTime() + exam.durationMin * 60000;
  if (exam.openToMs && exam.openToMs < end) end = exam.openToMs;
  const body = qs.map((q, i) => q.type === "mcq"
    ? `<div class="q"><div class="qn">Câu ${i + 1} · trắc nghiệm · ${q.points} điểm</div><div style="margin-bottom:6px">${nl(q.text)}</div>${q.options.map((o, k) => `<label class="opt"><input type="radio" name="${q.id}" value="${k}" ${att.answers?.[q.id] === k ? "checked" : ""} data-change="ans" data-q="${q.id}" data-aid="${aid}"><span>${esc(o)}</span></label>`).join("")}</div>`
    : `<div class="q"><div class="qn">Câu ${i + 1} · tự luận · ${q.points} điểm</div><div style="margin-bottom:6px">${nl(q.text)}</div><textarea rows="6" data-input="ansText" data-q="${q.id}" data-aid="${aid}">${esc(att.answers?.[q.id] || "")}</textarea></div>`).join("");
  onAfter(() => {
    const el = document.getElementById("countdown");
    const tick = async () => {
      const left = Math.max(0, end - Date.now()); const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
      if (el) el.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      if (left <= 0) { clearInterval(examTimer); await submitAttempt(aid, true); }
    };
    tick(); examTimer = setInterval(tick, 1000);
  });
  return `<h1>${esc(exam.title)}</h1>
    <div class="timer"><span>Mốc ${esc(exam.milestone)} · ${qs.length} câu · ${exam.durationMin} phút · nộp trước ${new Date(end).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })} · bài tự lưu khi bạn trả lời</span><span>Còn lại <b id="countdown">--:--</b></span></div>
    ${body}
    <div class="row exam-submit"><button class="btn" data-act="submitExam" data-aid="${aid}">Nộp bài</button><span class="small muted">Nộp xong không sửa được nữa.</span></div>`;
}
let saveTimers = {};

async function submitAttempt(aid, auto) {
